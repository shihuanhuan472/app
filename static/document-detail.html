        .image-grid-small {

            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;

        .image-overlay-small {
            position: absolute !important;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3) !important;

            align-items: center !important;
            justify-content: center !important;
            opacity: 0 !important;
            transition: opacity 0.2s !important;

        .document-actions {

            .knowledge-book-layout { display: block !important; padding: 0 18px !important; }

                width: 100% !important;

    </style>
</head>
<body>
    <div class="delete-modal" id="deleteModal">
        <div class="delete-modal-content">
            <div class="delete-modal-header">
                <div class="delete-modal-title">
                    <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                    确认删除
                </div>
            </div>
            <div class="delete-modal-body" id="deleteModalMessage">
                确定要删除这篇文档吗？此操作不可撤销。
            </div>
            <div class="delete-modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>

    </div>

    <div class="system-container">
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🔧</div>
                    <span>维修辅助系统</span>
                </div>
            </div>
            <div class="nav-menu">
                <a href="main.html" class="nav-item active"><span class="nav-icon"><i class="fas fa-file-alt"></i></span><span>知识库</span></a>
                <a href="my-submissions.html" class="nav-item"><span class="nav-icon"><i class="fas fa-clipboard-list"></i></span><span>我的提交</span></a>
                <a href="ai-assist.html" class="nav-item"><span class="nav-icon"><i class="fas fa-robot"></i></span><span>AI辅助</span></a>
                <a href="user-management.html" class="nav-item"><span class="nav-icon"><i class="fas fa-users"></i></span><span>用户管理</span></a>
                <a href="user-profile.html" class="nav-item" style="display: none;"><span class="nav-icon"><i class="fas fa-user"></i></span><span>我的资料</span></a>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">我</div>
                    <div><div class="user-name" id="userName">当前用户</div><div class="user-role" id="userRole">技术人员</div></div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="Utils.logout()" style="margin-top: 10px; width: 100%;"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <div class="page-title">文档详情</div>
                    <div class="page-subtitle" id="docTitleSubtitle">文档详细内容</div>
                </div>
                <div class="header-actions">
                    <a href="main.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> 返回列表</a>
                </div>
            </div>

            <div class="document-detail-container" id="documentDetail">
                <div class="document-loading" id="loadingContainer">
                    <div class="loading-spinner"></div>
                    <p>正在加载文档详情...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDocument = null;
        let currentDocumentId = null;
        const KNOWLEDGE_TEXT_PREVIEW_LIMIT = 1800;
        const knowledgeExpandedSections = new Set();
        let currentKnowledgeBodySections = [];
        let manualProgrammaticScrollTimer = null;

        function getDocumentIdFromUrl() {
            return new URLSearchParams(window.location.search).get('id');
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getLibraryLabel(libraryType) {
            return libraryType === 'knowledge' ? '知识库' : '故障库';
        }

        function normalizeDocumentTags(tags) {
            if (Array.isArray(tags)) {
                return tags.map(tag => String(tag).trim()).filter(Boolean);
            }
            if (typeof tags === 'string' && tags.trim()) {
                try {
                    const parsed = JSON.parse(tags);
                    if (Array.isArray(parsed)) {
                        return parsed.map(tag => String(tag).trim()).filter(Boolean);
                    }
                } catch (_) {
                    return tags.split(/[,，]/).map(tag => tag.trim()).filter(Boolean);
                }
            }
            return [];
        }

        function getTagsLabel(tags) {
            const normalizedTags = normalizeDocumentTags(tags);
            return normalizedTags.length ? normalizedTags.join('、') : '无';
        }

        function showError(message) {
            document.body.classList.remove('knowledge-reader-active');
            document.getElementById('documentDetail').innerHTML = `
                <div class="document-error">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ef4444; margin-bottom:20px;"></i>
                    <p style="color:#666; margin-bottom:20px;">${escapeHtml(message)}</p>
                    <div><a href="main.html" class="btn btn-secondary">返回列表</a></div>
                </div>
            `;
        }

        function getFullAssetUrl(relativeUrl) {
            if (!relativeUrl) return '';
            if (relativeUrl.startsWith('http://') || relativeUrl.startsWith('https://') || relativeUrl.startsWith('data:')) return relativeUrl;
            const apiBase = (API_CONFIG.BASE_URL || '').replace(/\/api\/v1\/?$/, '').replace(/\/$/, '');
            if (!apiBase) return `/${String(relativeUrl).replace(/^\/+/, '')}`;
            const cleanPath = String(relativeUrl).replace(/^\/+/, '');
            return `${apiBase}/${cleanPath}`;
        }

        function isAdminUser(user) {
            return !!user && Utils.hasRole(user, Utils.ROLE.ADMIN);
        }

        function normalizeImageUrls(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value.map(url => String(url).trim()).filter(Boolean);
            if (typeof value === 'string' && value.trim() && value !== 'null') {
                try {
                    const parsed = JSON.parse(value);
                    if (Array.isArray(parsed)) return parsed.map(url => String(url).trim()).filter(Boolean);
                } catch (_) {}
                return value.split(',').map(url => url.trim()).filter(Boolean);
            }
            return [];
        }

        function renderImageGrid(imageUrls) {
            const urls = normalizeImageUrls(imageUrls);
            if (!urls.length) return '';
            return `
                <div class="image-grid-small">
                    ${urls.map(url => {
                        const fullUrl = getFullAssetUrl(url);
                        return `
                            <div class="image-item-small" onclick="window.open('${fullUrl}', '_blank')">
                                <img src="${fullUrl}" alt="图片" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x120?text=加载失败'">
                                <div class="image-overlay-small"><i class="fas fa-search-plus" style="color:white; font-size:20px;"></i></div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function sectionLevelNumber(sectionType) {
            const raw = String(sectionType || '').trim();
            const outlineMatch = raw.match(/^\d+(?:\.\d+)*$/);
            if (outlineMatch) return Math.min(6, raw.split('.').length);
            const levelMatch = raw.match(/level_(\d+)/i);
            return levelMatch ? Math.min(6, Math.max(1, Number(levelMatch[1]) || 1)) : 1;
        }

        function sectionBadgeText(section, level) {
            const raw = String(section.section_type || '').trim().toLowerCase();
            if (raw === 'title') return '题目';
            if (raw === 'directory') return '目录';
            return section.section_type ? `章节 ${escapeHtml(section.section_type)}` : `${level}级章节`;
        }

        function normalizeLibraryType(value) {
            return String(value || '').trim().toLowerCase() === 'knowledge' ? 'knowledge' : 'breakdown';
        }

        function isKnowledgeDocument(doc, source) {
            return normalizeLibraryType(doc.library_type || source) === 'knowledge' || Array.isArray(doc.sections);
        }

        function renderInlineText(text) {
            return escapeHtml(text)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        function renderKnowledgeTextSegment(segment) {
            const lines = String(segment || '')
                .split(/\n+/)
                .map(line => line.trim())
                .filter(Boolean);

            const html = [];
            let listBuffer = [];
            let ordered = false;

            const flushList = () => {
                if (!listBuffer.length) return;
                html.push(`<${ordered ? 'ol' : 'ul'} class="knowledge-manual-list ${ordered ? 'ordered' : ''}">${listBuffer.join('')}</${ordered ? 'ol' : 'ul'}>`);
                listBuffer = [];
                ordered = false;
            };

            lines.forEach(line => {
                const bulletMatch = line.match(/^(?:[-*•])\s+(.+)$/);
                const orderedMatch = line.match(/^\d+[\.、]\s+(.+)$/);
                if (bulletMatch || orderedMatch) {
                    const isOrdered = !!orderedMatch;
                    if (listBuffer.length && ordered !== isOrdered) flushList();
                    ordered = isOrdered;
                    listBuffer.push(`<li>${renderInlineText((bulletMatch || orderedMatch)[1])}</li>`);
                    return;
                }
                flushList();
                html.push(`<p class="knowledge-paragraph">${renderInlineText(line)}</p>`);
            });
            flushList();
            return html.join('');
        }

        function renderInlineKnowledgeImage(url, index) {
            const fullUrl = getFullAssetUrl(url);
            const safeUrl = escapeHtml(fullUrl);
            return `
                <figure class="knowledge-inline-image">
                    <img src="${safeUrl}" loading="lazy" decoding="async" alt="图片${index}" onclick="window.open(this.src, '_blank')" onerror="this.onerror=null; this.src='https://via.placeholder.com/640x360?text=图片加载失败'">
                    <figcaption class="knowledge-inline-caption">Fig. ${index} · 文档截图</figcaption>
                </figure>
            `;
        }

        function renderKnowledgeSectionContent(section) {
            const imageUrls = normalizeImageUrls(section.image_urls);
            const text = section.plain_text || '';
            if (!text && !imageUrls.length) return '<p class="text-muted">无正文内容</p>';

            const sectionId = String(section.id || section.section_index || section.section_title || '');
            const isLongText = String(text).length > KNOWLEDGE_TEXT_PREVIEW_LIMIT;
            const isExpanded = knowledgeExpandedSections.has(sectionId);
            const renderText = isLongText && !isExpanded
                ? `${String(text).slice(0, KNOWLEDGE_TEXT_PREVIEW_LIMIT)}\n...`
                : text;
            const usedImageIndexes = new Set();
            let html = '';
            let lastIndex = 0;
            const markerPattern = /【图片(\d+)】/g;
            let match;
            while ((match = markerPattern.exec(renderText)) !== null) {
                html += renderKnowledgeTextSegment(renderText.slice(lastIndex, match.index));
                const imageIndex = Number(match[1]);
                const imageUrl = imageUrls[imageIndex - 1];
                if (imageUrl) {
                    usedImageIndexes.add(imageIndex - 1);
                    html += renderInlineKnowledgeImage(imageUrl, imageIndex);
                }
                lastIndex = markerPattern.lastIndex;
            }
            html += renderKnowledgeTextSegment(renderText.slice(lastIndex));

            if (!isLongText || isExpanded) {
                imageUrls.forEach((url, index) => {
                    if (!usedImageIndexes.has(index)) {
                        html += renderInlineKnowledgeImage(url, index + 1);
                    }
                });
            } else {
                imageUrls.slice(0, 2).forEach((url, index) => {
                    if (!usedImageIndexes.has(index)) {
                        usedImageIndexes.add(index);
                    }
                    html += renderInlineKnowledgeImage(url, index + 1);
                });
            }

            if (isLongText) {
                const hiddenImageCount = Math.max(0, imageUrls.length - usedImageIndexes.size);
                const buttonLabel = isExpanded ? '收起' : (hiddenImageCount ? `展开全文和剩余 ${hiddenImageCount} 张图片` : '展开全文');
                html += `<button type="button" class="knowledge-text-expander" data-section-id="${escapeHtml(sectionId)}">${buttonLabel}</button>`;
            }
            return html || '<p class="text-muted">无正文内容</p>';
        }

        function getKnowledgeSectionRole(section) {
            const type = String(section.section_type || '').trim().toLowerCase();
            const metaRole = section.metadata && section.metadata.section_role;
            return metaRole || type || 'body';
        }

        function getKnowledgeBodySections(doc) {
            return (Array.isArray(doc.sections) ? doc.sections : [])
                .slice()
                .sort((a, b) => (a.section_index ?? 0) - (b.section_index ?? 0))
                .filter(section => !['title', 'directory'].includes(getKnowledgeSectionRole(section)));
        }

        function getKnowledgeSpecialSection(doc, role) {
            return (Array.isArray(doc.sections) ? doc.sections : []).find(section => getKnowledgeSectionRole(section) === role);
        }

        function manualSectionId(section, index) {
            return `manual-section-${section.id || section.section_index || index}`;
        }

        function stripSectionTitleMarker(title, marker) {
            let value = String(title || '').trim();
            const normalizedMarker = String(marker || '').replace('．', '.').trim();
            if (normalizedMarker) {
                const escapedMarker = normalizedMarker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                value = value.replace(new RegExp(`^${escapedMarker}[、.．\\s]+`), '').trim();
            }
            return value.replace(/^\d+(?:[.．]\d+)*[、.．\s]+/, '').trim();
        }

        function getKnowledgeLead(bodySections) {
            const firstText = bodySections
                .map(section => String(section.plain_text || '').replace(/【图片\d+】/g, '').trim())
                .find(Boolean) || '';
            if (!firstText) return '该知识库文档已按章节解析，左侧为手册目录，右侧为当前页面大纲。';
            const firstLine = firstText.split(/\n+/).map(line => line.trim()).find(Boolean) || firstText;
            return firstLine.length > 180 ? `${firstLine.slice(0, 180)}…` : firstLine;
        }

        function renderManualToc(bodySections) {
            if (!bodySections.length) {
                return '<div class="text-muted" style="font-size:13px;">暂无可用目录，请重新解析该知识库文档。</div>';
            }
            return `
                <div class="manual-toc-list">
                    ${bodySections.map((section, index) => {
                        const level = sectionLevelNumber(section.section_type);
                        const sectionNo = section.section_type ? escapeHtml(section.section_type) : String(index + 1);
                        const title = stripSectionTitleMarker(section.section_title || `章节 ${index + 1}`, section.section_type);
                        return `<a class="manual-toc-item manual-toc-level-${level}" href="#${manualSectionId(section, index)}" data-section-id="${manualSectionId(section, index)}"><span class="manual-toc-number">${sectionNo}</span><span class="manual-toc-text">${escapeHtml(title)}</span></a>`;
                    }).join('')}
                </div>
            `;
        }

        function renderManualArticle(section, index) {
            const level = sectionLevelNumber(section.section_type);
            const title = stripSectionTitleMarker(section.section_title || `章节 ${index + 1}`, section.section_type);
            const sectionNo = section.section_type ? escapeHtml(section.section_type) : String(index + 1);
            const estimatedHeight = estimateManualArticleHeight(section);
            return `
                <article class="manual-article level-${level}" id="${manualSectionId(section, index)}" data-section-index="${index}" data-section-id="${manualSectionId(section, index)}">
                    <div class="manual-article-header">
                        <span class="manual-section-number">${sectionNo}</span>
                        <h2>${escapeHtml(title)}</h2>
                    </div>
                    <div class="manual-article-body manual-article-body-placeholder" style="min-height:${estimatedHeight}px; contain-intrinsic-size:${estimatedHeight}px;">
                        <div class="section-loading-skeleton">内容加载中...</div>
                    </div>
                </article>
            `;
        }

        function estimateManualArticleHeight(section) {
            const textLength = String(section.plain_text || '').length;
            const imageCount = normalizeImageUrls(section.image_urls).length;
            const textHeight = Math.ceil(textLength / 34) * 32;
            const imageHeight = imageCount * 620;
            return Math.min(8000, Math.max(180, textHeight + imageHeight + 160));
        }

        function renderManualArticleBody(section, index) {
            const hasContent = !!String(section.plain_text || '').trim() || normalizeImageUrls(section.image_urls).length > 0;
            return hasContent
                ? renderKnowledgeSectionContent(section)
                : '<div class="manual-section-placeholder"><i class="fas fa-sitemap"></i> 该条为目录分组，本级没有独立正文，请阅读其下级章节。</div>';
        }

        function renderKnowledgeManualDocument(doc, context) {
            const bodySections = getKnowledgeBodySections(doc);
            currentKnowledgeBodySections = bodySections;
            const titleSection = getKnowledgeSpecialSection(doc, 'title');
            const manualTitle = (titleSection && titleSection.section_title) || doc.title || '知识库手册';
            const sectionCount = bodySections.length;
            const imageCount = bodySections.reduce((sum, section) => sum + normalizeImageUrls(section.image_urls).length, 0);
            const tagsLabel = context.tagsLabel || '无';
            const originalFileHtml = context.originalFileHtml || '';
            const actionButtons = context.actionButtons || '';
            const lead = getKnowledgeLead(bodySections);
            const tocHtml = renderManualToc(bodySections);
            return `
                <div class="knowledge-reading-progress" id="knowledgeReadingProgress"></div>
                <div class="knowledge-book-page">
                    <div class="knowledge-book-topbar">
                        <div class="knowledge-book-brand"><i class="fas fa-book-open"></i><span>维修知识库文档</span></div>
                        <div class="knowledge-book-actions-inline">
                            <a href="main.html" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> 返回列表</a>
                        </div>
                    </div>
                    <div class="knowledge-book-layout">
                        <aside class="knowledge-book-sidebar" aria-label="文档章节导航">
                            <a class="book-sidebar-home" href="main.html"><i class="fas fa-book"></i><span>知识库首页</span></a>
                            <details class="book-part" open>
                                <summary class="book-part__summary"><span class="book-part__title">Part I · 文档章节</span></summary>
                                <div class="book-part__body">${tocHtml}</div>
                            </details>
                        </aside>
                        <div class="knowledge-book-content-wrap">
                            <article class="knowledge-book-main" role="main">
                                <section class="book-page-header-section">
                                    <nav aria-label="breadcrumb" class="modern-breadcrumb-nav">
                                        <div class="breadcrumb-button-container">
                                            <a href="main.html" class="breadcrumb-button breadcrumb-home"><i class="fa-solid fa-house"></i></a>
                                            <a href="main.html" class="breadcrumb-button"><i class="fa-solid fa-book"></i><span>知识库</span></a>
                                            <span class="breadcrumb-button breadcrumb-current"><i class="fa-solid fa-file-text"></i><span>${escapeHtml(manualTitle)}</span></span>
                                        </div>
                                    </nav>
                                    <div class="book-header">
                                        <h1 class="knowledge-book-title">${escapeHtml(manualTitle)}</h1>
                                        <div class="knowledge-book-meta">
                                            <span><i class="fas fa-user"></i>${escapeHtml(context.authorName)}</span>
                                            <span><i class="fas fa-calendar-alt"></i>${Utils.formatDate(doc.first_edit_date, 'YYYY-MM-DD HH:mm')}</span>
                                            <span><i class="fas fa-hashtag"></i>ID ${doc.id}</span>
                                            <span><i class="fas fa-tags"></i>${escapeHtml(tagsLabel)}</span>
                                        </div>
                                    </div>
                                </section>
                                <div class="knowledge-book-content post-card">
                                    <p class="knowledge-lead">${escapeHtml(lead)}</p>
                                    ${bodySections.length ? bodySections.map((section, index) => renderManualArticle(section, index)).join('') : '<div class="section-content knowledge-empty">暂无章节内容，请重新解析该知识库文档。</div>'}
                                    ${originalFileHtml ? `<div class="manual-appendix">${originalFileHtml}</div>` : ''}
                                </div>
                            </article>

                        </div>
                    </div>
                    <div class="document-actions knowledge-manual-actions">${actionButtons}</div>
                </div>
            `;
        }

        function renderKnowledgeSections(doc) {
            const sections = Array.isArray(doc.sections) ? doc.sections : [];
            if (!sections.length) {
                return `
                    <div class="document-section">
                        <div class="section-header"><i class="fas fa-book-open"></i><h3>文档章节</h3></div>
                        <div class="section-content knowledge-empty">暂无章节内容，请重新解析该知识库文档。</div>
                    </div>
                `;
            }

            return sections
                .slice()
                .sort((a, b) => (a.section_index ?? 0) - (b.section_index ?? 0))
                .map((section, index) => {
                    const level = sectionLevelNumber(section.section_type);
                    const sectionNo = sectionBadgeText(section, level);
                    const title = section.section_title || `章节 ${index + 1}`;
                    const contentHtml = renderKnowledgeSectionContent(section);
                    return `
                        <div class="document-section knowledge-section level-${level}">
                            <div class="section-header">
                                <i class="fas fa-book-open"></i>
                                <h3>${escapeHtml(title)}</h3>
                                <span class="section-level-badge">${sectionNo}</span>
                            </div>
                            <div class="section-content">${contentHtml}</div>
                        </div>
                    `;
                }).join('');
        }

        function renderBreakdownSections(doc) {
            const sections = [
                { title: '问题描述', content: doc.problem_intro, imgField: 'image_urls_problem_intro', icon: 'question-circle' },
                { title: '原因分析', content: doc.causes, imgField: 'image_urls_causes', icon: 'search' },
                { title: '故障评估', content: doc.evaluation, imgField: 'image_urls_evaluation', icon: 'clipboard-list' },
                { title: '检查步骤', content: doc.inspection, imgField: 'image_urls_inspection', icon: 'clipboard-check' },
                { title: '解决方案', content: doc.solutions, imgField: 'image_urls_solutions', icon: 'tools' },
                { title: '关键要点', content: doc.key_points, imgField: 'image_urls_key_points', icon: 'star' }
            ];

            return sections.map(section => {
                const contentHtml = section.content ? escapeHtml(section.content).replace(/\n/g, '<br>') : '<p class="text-muted">无</p>';
                return `
                    <div class="document-section">
                        <div class="section-header"><i class="fas fa-${section.icon}"></i><h3>${section.title}</h3></div>
                        <div class="section-content">${contentHtml}</div>
                        ${renderImageGrid(doc[section.imgField])}
                    </div>
                `;
            }).join('');
        }

        function openDeleteModal(docId, docTitle) {
            const currentUser = Utils.getCurrentUser();
            if (!isAdminUser(currentUser)) {
                Utils.showMessage('请在“我的提交”中发起删除审核', 'warning');
                return;
            }
            currentDocumentId = docId;
            document.getElementById('deleteModalMessage').innerHTML = `确定要删除文档 <strong>"${escapeHtml(docTitle || '未命名文档')}"</strong> 吗？<br><span style="color:#ef4444; font-size:14px;">此操作不可撤销。</span>`;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            currentDocumentId = null;
        }

        async function confirmDelete() {
            if (!currentDocumentId) return;
            try {
                // 删除时传递当前库类型，避免两张表存在相同 id 时删错库。
                const source = new URLSearchParams(window.location.search).get('source') || 'breakdown';
                const result = await documentAPI.deleteDocument(currentDocumentId, source);
                if (result) {
                    Utils.showMessage('文档删除成功', 'success');
                    closeDeleteModal();
                    setTimeout(() => window.location.href = 'main.html', 1000);
                } else {
                    Utils.showMessage('文档删除失败', 'error');
                }
            } catch (error) {
                Utils.showMessage('删除失败: ' + (error.message || '未知错误'), 'error');
            }
        }

        function goToEditPage(docId) {
            const currentUser = Utils.getCurrentUser();
            if (!isAdminUser(currentUser)) {
                const source = new URLSearchParams(window.location.search).get('source') || 'breakdown';
                window.location.href = `edit-document.html?id=${docId}&mode=review&source=${encodeURIComponent(source)}`;
                return;
            }
            // 编辑页要继续沿用详情页的库类型，避免保存知识库文档时默认落到故障库。
            const source = new URLSearchParams(window.location.search).get('source') || 'breakdown';
            window.location.href = `edit-document.html?id=${docId}&source=${encodeURIComponent(source)}`;
        }

        async function submitDeleteReviewFromDetail(docId) {
            const source = new URLSearchParams(window.location.search).get('source') || 'breakdown';
            if (!confirm('确定提交删除审核吗？审核通过后该文档将被删除。')) return;
            try {
                await reviewAPI.submitDeleteReview(docId, '技术人员发起删除申请', source);
                Utils.showMessage('删除审核已提交', 'success');
                setTimeout(() => window.location.href = 'my-submissions.html', 1000);
            } catch (error) {
                Utils.showMessage(error.message || '提交删除审核失败', 'error');
            }
        }

        function initializeManualReader() {
            const progress = document.getElementById('knowledgeReadingProgress');
            const links = Array.from(document.querySelectorAll('.manual-toc-item[data-section-id]'));
            const sections = links
                .map(link => document.getElementById(link.dataset.sectionId))
                .filter(Boolean);

            const renderArticleIfNeeded = (article) => {
                if (!article || article.dataset.rendered === '1') return;
                const index = Number(article.dataset.sectionIndex);
                const section = currentKnowledgeBodySections[index];
                const body = article.querySelector('.manual-article-body');
                if (!section || !body) return;
                body.innerHTML = renderManualArticleBody(section, index);
                body.classList.remove('manual-article-body-placeholder');
                article.dataset.rendered = '1';
            };

            const setActive = (id, force = false) => {
                if (manualProgrammaticScrollTimer && !force) return;
                links.forEach(link => {
                    link.classList.toggle('is-active', link.dataset.sectionId === id);
                });
            };

            const updateProgress = () => {
                if (!progress) return;
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const docHeight = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                progress.style.width = `${Math.min(100, Math.max(0, (scrollTop / docHeight) * 100))}%`;
            };

            const scrollToSection = (target) => {
                if (!target) return;
                const headerOffset = 96;
                const top = target.getBoundingClientRect().top + window.pageYOffset - headerOffset;
                window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
            };

            if ('IntersectionObserver' in window && sections.length) {
                const renderObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            renderArticleIfNeeded(entry.target);
                            renderObserver.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '900px 0px 900px 0px', threshold: 0 });

                sections.slice(0, 2).forEach(renderArticleIfNeeded);
                sections.slice(2).forEach(section => renderObserver.observe(section));

                const observer = new IntersectionObserver((entries) => {
                    const visible = entries
                        .filter(entry => entry.isIntersecting)
                        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
                    if (visible) setActive(visible.target.id);
                }, { rootMargin: '-20% 0px -68% 0px', threshold: [0, 0.1, 0.25] });
                sections.forEach(section => observer.observe(section));
            } else if (links[0]) {
                setActive(links[0].dataset.sectionId);
            }

            links.forEach(link => {
                link.addEventListener('click', (event) => {
                    const target = document.getElementById(link.dataset.sectionId);
                    if (!target) return;
                    event.preventDefault();
                    renderArticleIfNeeded(target);
                    if (manualProgrammaticScrollTimer) clearTimeout(manualProgrammaticScrollTimer);
                    manualProgrammaticScrollTimer = setTimeout(() => {
                        manualProgrammaticScrollTimer = null;
                    }, 700);
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => scrollToSection(target));
                    });
                    history.replaceState(null, '', `#${link.dataset.sectionId}`);
                    setActive(link.dataset.sectionId, true);
                });
            });

            const detailRoot = document.getElementById('documentDetail');
            if (detailRoot && detailRoot.dataset.expanderBound !== '1') {
                detailRoot.dataset.expanderBound = '1';
                detailRoot.addEventListener('click', (event) => {
                    const button = event.target.closest('.knowledge-text-expander[data-section-id]');
                    if (!button) return;
                    const sectionId = button.dataset.sectionId;
                    if (!sectionId) return;
                    const article = button.closest('.manual-article');
                    const index = article ? Number(article.dataset.sectionIndex) : -1;
                    const section = currentKnowledgeBodySections[index];
                    const body = article ? article.querySelector('.manual-article-body') : null;
                    if (knowledgeExpandedSections.has(sectionId)) {
                        knowledgeExpandedSections.delete(sectionId);
                    } else {
                        knowledgeExpandedSections.add(sectionId);
                    }
                    if (section && body) {
                        body.innerHTML = renderManualArticleBody(section, index);
                        body.classList.remove('manual-article-body-placeholder');
                        article.dataset.rendered = '1';
                    }
                });
            }

            window.addEventListener('scroll', updateProgress, { passive: true });
            updateProgress();
            if (links[0]) setActive(links[0].dataset.sectionId);

            const hashId = decodeURIComponent((window.location.hash || '').replace(/^#/, ''));
            if (hashId) {
                const target = document.getElementById(hashId);
                if (target) {
                    renderArticleIfNeeded(target);
                    if (manualProgrammaticScrollTimer) clearTimeout(manualProgrammaticScrollTimer);
                    manualProgrammaticScrollTimer = setTimeout(() => {
                        manualProgrammaticScrollTimer = null;
                    }, 700);
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => scrollToSection(target));
                    });
                }
            }
        }

        async function loadDocumentDetail() {
            const docId = getDocumentIdFromUrl();
            currentDocumentId = docId;
            if (!docId) {
                showError('文档ID无效');
                return;
            }

            try {
                // 详情页根据列表传来的 source 查询对应表，避免知识库/故障库同 id 时读取错误。
                const source = new URLSearchParams(window.location.search).get('source') || 'breakdown';
                const doc = await documentAPI.getDocumentById(docId, source);
                if (!doc) {
                    showError('文档不存在或已被删除');
                    return;
                }

                currentDocument = doc;
                document.title = `${doc.title || '文档详情'} - 维修辅助系统`;
                document.getElementById('docTitleSubtitle').textContent = doc.title || '文档详情';

                const currentUser = Utils.getCurrentUser();
                const currentUserId = currentUser ? currentUser.id : null;
                const isAdmin = isAdminUser(currentUser);
                const isAuthor = currentUserId && String(currentUserId) === String(doc.contributor_id);
                const isTechnicianAuthor = !!currentUser && Utils.hasRole(currentUser, Utils.ROLE.TECHNICIAN) && isAuthor;
                const showEditDeleteButtons = isAdmin || isTechnicianAuthor;

                let authorName = doc.contributor_name || `用户${doc.contributor_id}`;
                if (isAuthor) authorName = '我';
                const libraryType = normalizeLibraryType(doc.library_type || source);
                const libraryLabel = getLibraryLabel(libraryType);
                const tagsLabel = getTagsLabel(doc.tag);

                const isKnowledge = isKnowledgeDocument(doc, source);
                document.body.classList.toggle('knowledge-reader-active', isKnowledge);
                const sectionsHtml = isKnowledge ? '' : renderBreakdownSections(doc);

                let originalFileHtml = '';
                if (doc.origin_file_name && doc.origin_file_dir) {
                    const fileUrl = getFullAssetUrl(doc.origin_file_dir);
                    const fileExt = String(doc.origin_file_name).split('.').pop().toLowerCase();
                    const isPreviewable = ['pdf', 'jpg', 'jpeg', 'png', 'gif', 'bmp'].includes(fileExt);

                    const iconMap = {
                        pdf: 'fa-file-pdf',
                        doc: 'fa-file-word',
                        docx: 'fa-file-word',
                        ppt: 'fa-file-powerpoint',
                        pptx: 'fa-file-powerpoint',
                        xls: 'fa-file-excel',
                        xlsx: 'fa-file-excel',
                        txt: 'fa-file-alt'
                    };
                    const iconClass = iconMap[fileExt] || 'fa-file';
                    const safeFileName = String(doc.origin_file_name).replace(/'/g, "\\'");

                    originalFileHtml = `
                        <div class="document-section original-file-section">
                            <div class="section-header">
                                <i class="fas fa-paperclip"></i>
                                <h3>原始附件</h3>
                            </div>
                            <div class="original-file-content">
                                <div class="file-info">
                                    <i class="fas ${iconClass} file-icon"></i>
                                    <span class="file-name">${escapeHtml(doc.origin_file_name)}</span>
                                </div>
                                <div class="file-actions">
                                    ${isPreviewable ? `<a href="${fileUrl}" target="_blank" class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i> 预览</a>` : ''}
                                    <a href="javascript:void(0)" onclick="downloadFile('${fileUrl}', '${safeFileName}')" class="btn btn-sm btn-primary"><i class="fas fa-download"></i> 下载</a>
                                </div>
                                ${!isPreviewable ? '<p class="text-muted" style="margin-top:10px; font-size:13px;">该格式无法直接预览，请下载后使用本地软件打开。</p>' : ''}
                            </div>
                        </div>
                    `;
                }

                let actionButtons = `<div class="action-left"><a href="main.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> 返回列表</a></div>`;
                if (showEditDeleteButtons) {
                    if (isAdmin) {
                        actionButtons += `
                            <div class="action-right">
                                <button class="btn btn-primary" onclick="goToEditPage(${doc.id})"><i class="fas fa-edit"></i> 编辑</button>
                                <button class="btn btn-danger" onclick="openDeleteModal(${doc.id}, '${escapeHtml(doc.title || '').replace(/'/g, "\\'")}')"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        `;
                    } else {
                        actionButtons += `
                            <div class="action-right">
                                <button class="btn btn-primary" onclick="goToEditPage(${doc.id})"><i class="fas fa-edit"></i> 提交修改</button>
                                <button class="btn btn-danger" onclick="submitDeleteReviewFromDetail(${doc.id})"><i class="fas fa-trash"></i> 提交删除</button>
                            </div>
                        `;
                    }
                }

                let html = '';
                if (isKnowledge) {
                    html = renderKnowledgeManualDocument(doc, {
                        authorName,
                        tagsLabel,
                        originalFileHtml,
                        actionButtons
                    });
                } else {
                    html = `
                        <div class="document-detail-content">
                            <div class="document-header">
                                <h1 class="document-title">${escapeHtml(doc.title || '无标题')}</h1>
                                <div class="document-meta">
                                    <div class="meta-item"><i class="fas fa-user"></i><span>作者：${escapeHtml(authorName)}</span></div>
                                    <div class="meta-item"><i class="fas fa-calendar-alt"></i><span>创建时间：${Utils.formatDate(doc.first_edit_date, 'YYYY-MM-DD HH:mm')}</span></div>
                                    <div class="meta-item"><i class="fas fa-hashtag"></i><span>文档ID：${doc.id}</span></div>
                                    <div class="meta-item"><i class="fas fa-layer-group"></i><span>所属库：${escapeHtml(libraryLabel)}</span></div>
                                    <div class="meta-item"><i class="fas fa-tags"></i><span>标签：${escapeHtml(tagsLabel)}</span></div>
                                </div>
                            </div>
                            ${sectionsHtml}
                            ${originalFileHtml}
                            <div class="document-actions">${actionButtons}</div>
                        </div>
                    `;
                }

                document.getElementById('documentDetail').innerHTML = html;
                if (isKnowledge) initializeManualReader();
            } catch (error) {
                console.error('加载文档详情失败:', error);
                showError('加载文档详情失败: ' + (error.message || '未知错误'));
            }
        }

        async function downloadFile(url, filename) {
            try {
                const response = await fetch(url, {
                    mode: 'cors',
                    credentials: 'omit'
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                console.warn('下载失败，尝试直接打开', error);
                window.open(url, '_blank');
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            Utils.checkLogin();
            await loadDocumentDetail();
        });

        document.getElementById('deleteModal')?.addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDeleteModal();
        });
    </script>
