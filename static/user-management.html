<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 设备维修辅助系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
</head>
<body>
    <div class="system-container">
        <!-- 侧边导航栏 -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🔧</div>
                    <span>维修辅助系统</span>
                </div>
            </div>

            <div class="nav-menu">
                <a href="main.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
                    <span>知识库</span>
                </a>
                <a href="ai-assist.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-robot"></i></span>
                    <span>AI辅助</span>
                </a>
                <!-- 管理员显示这个 -->
                <a href="user-management.html" class="nav-item active">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span>用户管理</span>
                </a>
                <!-- 技术人员显示这个 -->
                <a href="user-profile.html" class="nav-item" style="display: none;">
                    <span class="nav-icon"><i class="fas fa-user"></i></span>
                    <span>我的资料</span>
                </a>
            </div>

            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">李</div>
                    <div>
                        <div class="user-name" id="userName">李四</div>
                        <div class="user-role" id="userRole">维修工程师</div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="Utils.logout()" style="margin-top: 10px; width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 搜索框 -->
            <div class="user-search">
                <input type="text" placeholder="搜索用户..." oninput="searchUsers(this.value)">
                <i class="fas fa-search"></i>
            </div>
            <div class="header">
                <div>
                    <div class="page-title">用户管理</div>
                    <div class="page-subtitle">管理系统用户和权限</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showAddUserModal()">
                        <i class="fas fa-user-plus"></i> 添加用户
                    </button>
                </div>
            </div>

            <!-- 用户列表 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">用户列表</div>
                    <div class="card-subtitle" id="userCount">共6个用户</div>
                </div>
                <!-- 在用户列表后面添加分页控件 -->
                <div class="user-list" id="userList">
                    <!-- 用户卡片会动态加载 -->
                </div>

                <!-- 分页控件 -->
                <div class="pagination" id="pagination">
                    <button class="pagination-btn" onclick="changePage(currentPage - 1)" id="prevBtn" disabled>
                        <i class="fas fa-chevron-left"></i> 上一页
                    </button>

                    <div class="page-numbers" id="pageNumbers">
                        <!-- 页码会动态生成 -->
                    </div>

                    <button class="pagination-btn" onclick="changePage(currentPage + 1)" id="nextBtn">
                        下一页 <i class="fas fa-chevron-right"></i>
                    </button>

                    <div class="page-info">
                        <span id="pageInfo">第 1 页，共 1 页</span>
                        <select class="page-size-select" id="pageSizeSelect" onchange="changePageSize()">
                            <option value="3">每页 3 人</option>
                            <option value="6" selected>每页 6 人</option>
                            <option value="9">每页 9 人</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加用户模态框 -->
    <div class="modal" id="addUserModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加新用户</h3>
                <button class="btn btn-icon" onclick="closeAddUserModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="form-group">
                        <label>用户名 *</label>
                        <input type="text" id="newUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="newName" placeholder="请输入姓名" required>
                    </div>
                    <div class="form-group">
                        <label>部门 *</label>
                        <input type="text" id="newDepartment" placeholder="请输入部门" required>
                    </div>
                    <div class="form-group">
                        <label>电话 *</label>
                        <input type="tel" id="newPhone" placeholder="请输入电话" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱 *</label>
                        <input type="email" id="newEmail" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label>角色 *</label>
                        <select id="newRole" required>
                            <option value="">请选择角色</option>
                            <option value="technician">技术人员</option>
                            <option value="admin">系统管理员</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddUserModal()">取消</button>
                <button class="btn btn-primary" onclick="addUser()">添加用户</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态
            const user = Utils.checkLogin();
            Utils.loadUserInfo();

            // 如果是技术人员，跳转到个人资料页面
            if (user.role !== 'admin') {
                window.location.href = 'user-profile.html';
                return;
            }

            // 管理员继续加载用户管理功能
            loadUsers();
            updateStats();
        });

        // 显示添加用户模态框
        function showAddUserModal() {
            document.getElementById('addUserModal').style.display = 'flex';
        }

        // 关闭添加用户模态框
        function closeAddUserModal() {
            document.getElementById('addUserModal').style.display = 'none';
            document.getElementById('addUserForm').reset();

            // 清除错误样式
            const inputs = document.querySelectorAll('#addUserForm input, #addUserForm select');
            inputs.forEach(input => {
                input.classList.remove('error');
                const formGroup = input.closest('.form-group');
                if (formGroup) {
                    const errorMsg = formGroup.querySelector('.error-message');
                    if (errorMsg) errorMsg.remove();
                }
            });
        }

        // 添加用户
        function addUser() {
            const username = document.getElementById('newUsername').value.trim();
            const name = document.getElementById('newName').value.trim();
            const department = document.getElementById('newDepartment').value.trim();
            const phone = document.getElementById('newPhone').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const role = document.getElementById('newRole').value;

            // 验证必填字段
            if (!username || !name || !department || !phone || !email || !role) {
                Utils.showMessage('请填写完整的用户信息', 'error');

                // 高亮空字段
                ['newUsername', 'newName', 'newDepartment', 'newPhone', 'newEmail', 'newRole'].forEach(id => {
                    const input = document.getElementById(id);
                    if (!input.value.trim()) {
                        highlightError(input, '此字段不能为空');
                    }
                });
                return;
            }

            // 验证邮箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                Utils.showMessage('请输入有效的邮箱地址', 'error');
                highlightError(document.getElementById('newEmail'), '请输入有效的邮箱地址');
                return;
            }

            // 验证电话格式（简单验证）
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                Utils.showMessage('请输入有效的手机号码', 'error');
                highlightError(document.getElementById('newPhone'), '请输入有效的手机号码');
                return;
            }

            // 检查用户名是否已存在
            const existingUser = MockData.getUsers().find(user => user.username === username);
            if (existingUser) {
                Utils.showMessage('用户名已存在，请使用其他用户名', 'error');
                highlightError(document.getElementById('newUsername'), '用户名已存在');
                return;
            }

            // 创建新用户
            const newUser = {
                username: username,
                name: name,
                role: role,
                department: department,
                phone: phone,
                email: email
            };

            // 添加到数据
            const addedUser = MockData.addUser(newUser);

            // 显示成功消息
            Utils.showMessage(`用户"${name}"添加成功！`, 'success');

            // 关闭模态框并刷新列表
            closeAddUserModal();

            // 重置到第一页并重新加载
            currentPage = 1;
            loadUsers();

            // 滚动到顶部
            setTimeout(() => {
                document.querySelector('.user-list').scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        // 编辑用户
        function editUser(userId) {
            const users = MockData.getUsers();
            const user = users.find(u => u.id === userId);

            if (user) {
                // 填充表单
                document.getElementById('newUsername').value = user.username;
                document.getElementById('newName').value = user.name;
                document.getElementById('newDepartment').value = user.department;
                document.getElementById('newPhone').value = user.phone;
                document.getElementById('newEmail').value = user.email;
                document.getElementById('newRole').value = user.role;

                // 修改模态框标题和按钮
                const modal = document.getElementById('addUserModal');
                modal.querySelector('h3').textContent = '编辑用户';
                modal.querySelector('.modal-footer .btn-primary').textContent = '保存更改';
                modal.querySelector('.modal-footer .btn-primary').onclick = function() {
                    saveUserEdit(userId);
                };

                modal.style.display = 'flex';
            }
        }

        // 保存用户编辑
        function saveUserEdit(userId) {
            // 类似addUser的验证逻辑，但跳过用户名唯一性检查
            const username = document.getElementById('newUsername').value.trim();
            const name = document.getElementById('newName').value.trim();
            const department = document.getElementById('newDepartment').value.trim();
            const phone = document.getElementById('newPhone').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const role = document.getElementById('newRole').value;

            if (!username || !name || !department || !phone || !email || !role) {
                Utils.showMessage('请填写完整的用户信息', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                Utils.showMessage('请输入有效的邮箱地址', 'error');
                return;
            }

            // 更新用户
            const users = MockData.getUsers();
            const userIndex = users.findIndex(u => u.id === userId);
            if (userIndex !== -1) {
                users[userIndex] = {
                    ...users[userIndex],
                    username,
                    name,
                    department,
                    phone,
                    email,
                    role
                };

                // 重新加载页面数据（模拟API更新）
                MockData.users = users;

                Utils.showMessage(`用户"${name}"更新成功！`, 'success');
                closeAddUserModal();
                loadUsers();
            }
        }

        // 删除用户
        function deleteUser(userId) {
            if (!confirm('确定要删除这个用户吗？此操作不可恢复。')) {
                return;
            }

            const success = MockData.deleteUser(userId);
            if (success) {
                Utils.showMessage('用户删除成功', 'success');

                // 重新加载数据，分页会自动调整
                loadUsers();

                // 如果当前页没有数据了，自动回到前一页
                const users = MockData.getUsers();
                const startIndex = (currentPage - 1) * pageSize;
                if (users.length <= startIndex && currentPage > 1) {
                    currentPage--;
                    loadUsers();
                }
            } else {
                Utils.showMessage('删除用户失败', 'error');
            }
        }

        // 高亮错误字段（从common.js复制过来，确保能正确调用）
        function highlightError(input, message) {
            const formGroup = input.closest('.form-group');
            if (!formGroup) return;

            // 移除现有的错误信息
            const existingError = formGroup.querySelector('.error-message');
            if (existingError) existingError.remove();

            // 添加错误样式
            input.classList.add('error');

            // 添加错误信息
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message';
            errorEl.textContent = message;
            errorEl.style.color = '#ef4444';
            errorEl.style.fontSize = '12px';
            errorEl.style.marginTop = '4px';

            formGroup.appendChild(errorEl);
        }

        // 搜索用户
        function searchUsers(query) {
            const users = MockData.getUsers();
            const filteredUsers = users.filter(user =>
                user.name.includes(query) ||
                user.username.includes(query) ||
                user.department.includes(query) ||
                user.email.includes(query) ||
                user.phone.includes(query)
            );

            // 使用common.js中的displayUsers显示搜索结果
            // 这里需要修改common.js中的displayUsers以支持传入用户列表
            // 或者直接在这里处理分页逻辑
            if (!query.trim()) {
                loadUsers(); // 清空搜索时恢复原列表
                return;
            }

            // 临时显示搜索结果（不分页）
            const container = document.getElementById('userList');
            const countElement = document.getElementById('userCount');

            if (filteredUsers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-search"></i>
                        <p>未找到匹配的用户</p>
                        <button class="btn btn-secondary" onclick="document.querySelector('.user-search input').value = ''; loadUsers();">
                            清除搜索
                        </button>
                    </div>
                `;
                countElement.textContent = `共找到 0 个用户`;
                return;
            }

            // 显示搜索结果
            let html = '';
            filteredUsers.forEach(user => {
                const colors = ['#4a9eff', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
                const colorIndex = user.id % colors.length;
                const avatarColor = user.avatarColor || colors[colorIndex];

                html += `
                    <div class="user-card">
                        <div class="user-status ${user.role === 'admin' ? 'active' : 'inactive'}"></div>
                        <div class="user-avatar-large" style="background: ${avatarColor}">
                            ${user.name.charAt(0)}
                        </div>
                        <div class="user-info-details">
                            <div class="user-info-name">${user.name}</div>
                            <div class="user-info-role">
                                <span class="badge" style="background: ${user.role === 'admin' ? '#fee2e2' : '#e7f5ff'};
                                    color: ${user.role === 'admin' ? '#dc2626' : '#1971c2'};
                                    padding: 4px 12px; border-radius: 16px; font-size: 13px; font-weight: 500;">
                                    ${user.role === 'admin' ? '👑 系统管理员' : '👷 技术人员'}
                                </span>
                            </div>
                            <ul class="user-info-list">
                                <li><i class="fas fa-building"></i> 部门：${user.department}</li>
                                <li><i class="fas fa-phone"></i> 电话：${user.phone}</li>
                                <li><i class="fas fa-envelope"></i> 邮箱：${user.email}</li>
                                <li><i class="fas fa-calendar-alt"></i> 入职时间：${user.hireDate}</li>
                            </ul>
                            <div style="margin-top: 20px; display: flex; gap: 12px;">
                                <button class="btn btn-secondary btn-sm" onclick="editUser(${user.id})">
                                    <i class="fas fa-edit"></i> 编辑
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})" ${user.role === 'admin' ? 'disabled' : ''}>
                                    <i class="fas fa-trash"></i> 删除
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            countElement.textContent = `共找到 ${filteredUsers.length} 个用户`;

            // 隐藏分页控件
            document.getElementById('pagination').style.display = 'none';
        }

        // 更新统计信息
        function updateStats() {
            const users = MockData.getUsers();
            const totalUsers = users.length;
            const adminUsers = users.filter(user => user.role === 'admin').length;
            const technicianUsers = users.filter(user => user.role === 'technician').length;

            document.getElementById('totalUsers').textContent = totalUsers;
            document.getElementById('adminUsers').textContent = adminUsers;
            document.getElementById('technicianUsers').textContent = technicianUsers;
        }

        // 在DOMContentLoaded和每次数据更新后调用
        document.addEventListener('DOMContentLoaded', function() {
            // ... 原有代码 ...
            loadUsers();
            updateStats(); // 添加这行
        });

        // 修改addUser和deleteUser函数，在操作成功后调用updateStats()

        // 导出到全局
        window.showAddUserModal = showAddUserModal;
        window.closeAddUserModal = closeAddUserModal;
        window.addUser = addUser;
        window.editUser = editUser;
        window.deleteUser = deleteUser;
        window.saveUserEdit = saveUserEdit;



    </script>
</body>
</html>
