<script>

    function ensureTableSpacing(text) {
        // 简单的启发式：如果三行以上以 | 开头，且前后没有空行，则在前后各加一个换行
        console.log(text);
        const lines = text.split('\n');
        let modified = false;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].trim().startsWith('|')) {
                let j = i;
                while (j < lines.length && lines[j].trim().startsWith('|')) j++;
                // 如果表格块前后不是空行，插入空行
                if (i > 0 && lines[i-1].trim() !== '') {
                    lines.splice(i, 0, '');
                    j++;
                    modified = true;
                }
                if (j < lines.length && lines[j].trim() !== '') {
                    lines.splice(j, 0, '');
                    modified = true;
                }
                i = j;
            }
        }
        return modified ? lines.join('\n') : text;
    }

    // Markdown解析配置
    const MarkdownParser = {
        // 配置marked解析器
        init() {
            marked.setOptions({
                gfm: true,          // GitHub风格的Markdown
                breaks: true,       // 将换行符转换为<br>
                headerIds: false,   // 为标题添加id
                mangle: false,      // 防止邮箱地址被混淆
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            return hljs.highlight(code, { language: lang }).value;
                        } catch (err) {
                            console.warn('代码高亮失败:', err);
                        }
                    }
                    return code;
                }
            });
        },

        // 安全地渲染Markdown（使用DOMPurify进行XSS防护）
        render(text) {
            if (!text) return '';

            try {
                ensureTableSpacing(text)
                // 先转换Markdown为HTML
                let html = marked.parse(text);
                // 使用DOMPurify进行安全清理
                html = DOMPurify.sanitize(html, {
                    ALLOWED_TAGS: [
                        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                        'p', 'br', 'span', 'div',
                        'strong', 'em', 'b', 'i', 'u', 's',
                        'ul', 'ol', 'li',
                        'blockquote',
                        'pre', 'code',
                        'a', 'img',
                        'table', 'thead', 'tbody', 'tr', 'th', 'td',
                        'hr'
                    ],
                    ALLOWED_ATTR: ['href', 'src', 'alt', 'title', 'class', 'id', 'target', 'rel'],
                    ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto|ftp):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i
                });
                return html;
            } catch (error) {
                console.error('Markdown解析失败:', error);
                // 如果解析失败，使用简单的HTML转义
                return this.escapeHtml(text).replace(/\n/g, '<br>');
            }
        },

        // HTML转义
        escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    };

    // 初始化Markdown解析器
    MarkdownParser.init();

    // AI对话系统 - 基于后端API
    class AIConversationSystem {
        constructor() {
            this.conversations = [];
            this.currentConversationId = null;
            this.currentAttachments = [];
            this.uploadedImages = [];
            this.currentPage = 1;
            this.pageSize = 8;
            this.totalPages = 1;
            this.totalCount = 0;
            this.isLoadingMore = false;      // 是否正在加载更多
            this.hasMore = true;             // 是否还有更多数据
            this.searchMode = false;         // 是否处于搜索模式（搜索时禁用滚动加载）
            this.scrollListener = null;      // 滚动监听函数引用（用于移除）
            // 初始化
            this.init();
        }

        // 设置无限滚动监听
        setupInfiniteScroll() {
            const historyList = document.getElementById('historyList');
            if (!historyList) return;

            // 移除旧的监听
            if (this.scrollListener) {
                historyList.removeEventListener('scroll', this.scrollListener);
            }

            // 定义滚动处理函数（使用节流）
            this.scrollListener = Utils.throttle(() => {
                // 非搜索模式、有更多数据、且不在加载中时触发
                if (this.searchMode || !this.hasMore || this.isLoadingMore) return;

                const { scrollTop, scrollHeight, clientHeight } = historyList;
                // 当滚动到距离底部 50px 时加载更多
                if (scrollHeight - scrollTop - clientHeight < 50) {
                    this.loadMoreHistory();
                }
            }, 200);

            historyList.addEventListener('scroll', this.scrollListener);
        }

        // 加载更多历史对话
        async loadMoreHistory() {
            if (this.isLoadingMore || !this.hasMore || this.searchMode) return;

            this.isLoadingMore = true;
            this.showLoadingIndicator(true); // 显示“加载中…”

            try {
                // 请求下一页（当前页+1），并设置为追加模式
                await this.loadHistoryList(this.currentPage + 1, true);
            } catch (error) {
                console.error('加载更多失败', error);
                this.showLoadingIndicator(false, '加载失败，请重试');
            } finally {
                this.isLoadingMore = false;
            }
        }

        // 控制加载提示的显示
        showLoadingIndicator(show, text = '加载中…') {
            const footer = document.getElementById('historyListFooter');
            if (!footer) return;
            footer.style.display = show ? 'block' : 'none';
            footer.textContent = show ? text : '';
        }

        // 显示“没有更多了”提示
        showNoMoreIndicator() {
            const footer = document.getElementById('historyListFooter');
            if (footer) {
                footer.style.display = 'block';
                footer.textContent = '没有更多对话了';
            }
        }

        // 全量渲染对话列表（替换原有内容）
        renderConversationList(conversations, container, resetFooter = true) {
            if (!container) return;
            if (resetFooter) this.showLoadingIndicator(false);

            if (conversations.length === 0) {
                container.innerHTML = `<div class="empty-history">暂无对话</div>`;
                return;
            }

            let html = '';
            conversations.forEach(conv => {
                html += this.generateHistoryItemHTML(conv);
            });
            container.innerHTML = html;
            this.attachHistoryItemEvents(container);
        }

        // 追加对话列表（保留原有内容）
        appendConversations(conversations, container) {
    if (!container || conversations.length === 0) return;

    const fragment = document.createDocumentFragment();
    conversations.forEach(conv => {
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = this.generateHistoryItemHTML(conv);
        const item = tempDiv.firstElementChild;
        if (item) fragment.appendChild(item);
    });

    // ✅ 先绑定事件，再添加到容器
    this.attachHistoryItemEvents(fragment);
    container.appendChild(fragment);
}

        // 生成单个历史项 HTML
        generateHistoryItemHTML(conv) {
            const isActive = conv.id === this.currentConversationId;
            const title = conv.title || '无标题对话';
            const shortTitle = title.length > 25 ? title.substring(0, 25) + '...' : title;
            const formattedDate = conv.updated_time ? Utils.formatDate(conv.updated_time, 'MM-DD HH:mm') : '';

            return `
                <div class="history-item ${isActive ? 'active' : ''}" data-id="${conv.id}">
                    <div class="history-item-title">${shortTitle}</div>
                    <div class="history-item-date">${formattedDate}</div>
                    <div class="history-item-actions">
                        <button class="btn-edit-title" title="修改标题" onclick="event.stopPropagation(); window.AIConversation.editConversationTitle(${conv.id}, '${(conv.title || '').replace(/'/g, "\\'")}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-delete-conversation" title="删除对话" onclick="event.stopPropagation(); window.AIConversation.deleteConversation(${conv.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // 为历史项绑定点击事件
        attachHistoryItemEvents(container) {
            container.querySelectorAll('.history-item').forEach(item => {
                const id = item.getAttribute('data-id');
                if (id) {
                    item.addEventListener('click', () => {
                        this.loadConversation(parseInt(id));
                    });
                }
            });
        }

        // 在 init 方法中添加窗口大小变化的监听
        async init() {
            // 检查登录状态
            Utils.checkLogin();
            Utils.loadUserInfo();

            // 设置事件监听
            this.setupEventListeners();

            // 加载历史对话列表（第一页）
            await this.loadHistoryList(1);

            // 尝试加载最后一次打开的对话
            const lastConversationId = sessionStorage.getItem('last_conversation_id');
            if (lastConversationId) {
                await this.loadConversation(parseInt(lastConversationId));
            }

            // // 添加窗口大小变化监听
            // window.addEventListener('resize', () => {
            //     this.adjustPaginationForWidth();
            // });
            //
            // // 初始调整一次
            // setTimeout(() => {
            //     this.adjustPaginationForWidth();
            // }, 100);

            this.setupInfiniteScroll();
        }

        async loadHistoryList(page = 1, append = false) {
            try {
                console.log('正在加载对话历史...', page, append);

                const container = document.getElementById('historyList');
                const searchInput = document.getElementById('historySearch');
                const searchQuery = searchInput.value.trim();

                // 设置搜索模式标志（搜索时禁用滚动加载）
                this.searchMode = !!searchQuery;

                // 如果不是追加模式，清空列表并重置加载状态
                if (!append) {
                    container.innerHTML = '';
                    this.currentPage = 1;
                    this.hasMore = true;
                    this.showLoadingIndicator(false);
                }

                let response = null;
                let conversations = [];
                let totalPages = 1;

                if (searchQuery) {
                    // 搜索模式：不分页，获取全部匹配结果
                    response = await conversationAPI.searchConversations(searchQuery);
                    console.log('搜索对话响应:', response);

                    if (response) {
                        if (typeof response === 'object' && response.code !== undefined) {
                            if (response.code === 1) {
                                conversations = response.data || [];
                            } else {
                                throw new Error(response.msg || '搜索对话失败');
                            }
                        } else if (Array.isArray(response)) {
                            conversations = response;
                        } else if (typeof response === 'object') {
                            conversations = response.data || response.history || [];
                        }
                    }

                    // 确保是数组
                    conversations = Array.isArray(conversations) ? conversations : [];
                    this.totalCount = conversations.length;
                    totalPages = 1; // 搜索模式只有一页
                } else {
                    // 分页模式
                    const pageData = { page: page, size: this.pageSize };
                    console.log('发送分页请求:', pageData);

                    try {
                        response = await conversationAPI.getHistoryPage(pageData);
                        console.log('分页响应:', response);
                    } catch (error) {
                        console.error('分页请求失败，尝试使用非分页接口', error);
                        // 降级：获取全部历史（不分页）
                        const historyResponse = await conversationAPI.getHistory();
                        if (historyResponse) {
                            if (typeof historyResponse === 'object' && historyResponse.code !== undefined) {
                                if (historyResponse.code === 1) {
                                    conversations = historyResponse.data || [];
                                } else {
                                    throw new Error(historyResponse.msg || '获取历史对话失败');
                                }
                            } else if (Array.isArray(historyResponse)) {
                                conversations = historyResponse;
                            } else {
                                conversations = historyResponse.data || [];
                            }
                        }
                        conversations = Array.isArray(conversations) ? conversations : [];
                        this.totalCount = conversations.length;
                        totalPages = 1;
                        // 直接渲染并返回（不执行后续分页逻辑）
                        this.renderConversationList(conversations, container, true);
                        this.hasMore = false;
                        if (conversations.length > 0) {
                            this.showNoMoreIndicator();
                        } else {
                            this.showLoadingIndicator(false);
                        }
                        this.setupInfiniteScroll();
                        return;
                    }

                    // 解析分页响应
                    if (response) {
                        if (typeof response === 'object' && response.code !== undefined) {
                            if (response.code === 1) {
                                const data = response.data;
                                if (data && typeof data === 'object') {
                                    if (Array.isArray(data.history)) {
                                        conversations = data.history;
                                        this.totalCount = data.total_count || 0;
                                        totalPages = data.total_pages || 1;
                                    } else if (Array.isArray(data)) {
                                        conversations = data;
                                        this.totalCount = data.length;
                                        totalPages = 1;
                                    } else {
                                        conversations = [];
                                        this.totalCount = 0;
                                        totalPages = 1;
                                    }
                                } else {
                                    conversations = [];
                                    this.totalCount = 0;
                                    totalPages = 1;
                                }
                            } else {
                                throw new Error(response.msg || '获取分页数据失败');
                            }
                        } else if (Array.isArray(response)) {
                            conversations = response;
                            this.totalCount = response.length;
                            totalPages = 1;
                        } else if (typeof response === 'object') {
                            if (Array.isArray(response.history)) {
                                conversations = response.history;
                                this.totalCount = response.total_count || 0;
                                totalPages = response.total_pages || 1;
                            } else if (Array.isArray(response.data)) {
                                conversations = response.data;
                                this.totalCount = response.total_count || response.data.length;
                                totalPages = response.total_pages || 1;
                            } else {
                                conversations = [];
                                this.totalCount = 0;
                                totalPages = 1;
                            }
                        } else {
                            conversations = [];
                            this.totalCount = 0;
                            totalPages = 1;
                        }
                    }

                    // 确保 conversations 是数组
                    conversations = Array.isArray(conversations) ? conversations : [];
                }

                // 按更新时间排序（最新的在前）
                if (conversations.length > 0) {
                    conversations.sort((a, b) => {
                        try {
                            const timeA = a.updated_time ? new Date(a.updated_time) : new Date(0);
                            const timeB = b.updated_time ? new Date(b.updated_time) : new Date(0);
                            return timeB - timeA;
                        } catch (error) {
                            console.error('排序错误:', error);
                            return 0;
                        }
                    });
                }

                // 搜索模式：直接全量渲染，禁用滚动加载
                if (this.searchMode) {
                    this.renderConversationList(conversations, container, true);
                    this.hasMore = false;
                    if (conversations.length > 0) {
                        this.showNoMoreIndicator(); // 显示“没有更多对话了”
                    } else {
                        container.innerHTML = '<div class="empty-history"><i class="fas fa-comments"></i><p>没有找到相关对话</p></div>';
                        this.showLoadingIndicator(false);
                    }
                    // 不需要更新分页信息，直接返回
                    return;
                }

                // 分页模式：根据 append 决定渲染方式
                if (append) {
                    // 追加模式：将新数据添加到列表末尾
                    this.appendConversations(conversations, container);
                } else {
                    // 非追加模式：全量渲染
                    this.renderConversationList(conversations, container, true);
                }

                // 更新分页状态
                this.currentPage = page;
                this.totalPages = totalPages;
                this.hasMore = this.currentPage < this.totalPages;

                // 控制底部提示
                if (!this.hasMore && conversations.length > 0) {
                    this.showNoMoreIndicator();
                } else {
                    this.showLoadingIndicator(false);
                }

                // 重新绑定滚动监听（确保事件存在）
                this.setupInfiniteScroll();

            } catch (error) {
                console.error('加载历史对话失败:', error, error.stack);
                Utils.showMessage('加载对话历史失败: ' + error.message, 'error');

                const container = document.getElementById('historyList');
                container.innerHTML = `
                    <div class="empty-history error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>加载失败，请重试</p>
                        <p style="font-size: 12px; margin-top: 5px;">${error.message}</p>
                    </div>
                `;
                this.showLoadingIndicator(false);
            }
        }

        // 加载对话 - 增强错误处理
        async loadConversation(conversationId) {
            try {
                console.log('正在加载对话...', conversationId);
                // 获取当前用户信息
                const currentUser = Utils.getCurrentUser();
                if (!currentUser) {
                    console.warn('未获取到当前用户信息，可能未登录');
                    // 清空本地存储的对话ID，防止继续尝试加载
                    sessionStorage.removeItem('last_conversation_id');
                    this.currentConversationId = null;
                    return;
                }
                // 检查对话ID是否有效
                if (!conversationId || isNaN(conversationId) || conversationId <= 0) {
                    // 清空无效的对话ID
                    sessionStorage.removeItem('last_conversation_id');
                    Utils.showMessage('无效的对话ID', 'error');
                    return;
                }

                // 获取对话信息
                const response = await conversationAPI.getConversationById(conversationId);

                console.log('获取对话响应:', response);

                // 根据你的控制台输出，response 已经是 data 部分
                // 我们需要检查 response 是否包含对话数据
                let conversation = null;

                if (response && typeof response === 'object') {
                    if (response.code !== undefined) {
                        // 这是完整的 Result 对象
                        if (response.code !== 1) {
                            throw new Error(response.msg || '对话不存在');
                        }
                        conversation = response.data;
                    } else if (response.id !== undefined) {
                        // 这已经是对话对象本身
                        conversation = response;
                    }
                }

                if (!conversation) {
                    Utils.showMessage('对话不存在或无权限访问', 'error');
                    this.currentConversationId = null;
                    sessionStorage.removeItem('last_conversation_id');

                    // 使用新方法
                    this.showEmptyState();
                    return;
                }

                this.currentConversationId = conversationId;
                sessionStorage.setItem('last_conversation_id', conversationId);

                // 更新对话头部
                document.getElementById('currentConversationTitle').textContent = conversation.title || '无标题对话';
                document.getElementById('currentConversationDate').textContent =
                    Utils.formatDate(conversation.updated_time, 'YYYY-MM-DD HH:mm:ss');

                // 显示输入区域
                const inputSection = document.getElementById('inputSection');
                if (inputSection) {
                    inputSection.style.display = 'block';
                }

                // 获取消息
                let messages = [];
                try {
                    const messagesResponse = await messageAPI.getMessagesByConversation(conversationId);

                    if (messagesResponse) {
                        if (messagesResponse.code !== undefined) {
                            // 完整的 Result 对象
                            if (messagesResponse.code === 1) {
                                messages = messagesResponse.data || [];
                            } else {
                                console.error('获取消息失败:', messagesResponse.msg);
                            }
                        } else if (Array.isArray(messagesResponse)) {
                            // 直接的消息数组
                            messages = messagesResponse;
                        }
                    }
                } catch (messageError) {
                    console.error('获取消息时出错:', messageError);
                    // 继续执行，显示空消息或错误消息
                }

                // 清空并加载消息
                this.loadMessages(messages);

                // 隐藏空状态
                const emptyState = document.getElementById('emptyState');
                if (emptyState) {
                    emptyState.style.display = 'none';
                }

                // 更新对话列表高亮
                await this.loadHistoryList(1);

            } catch (error) {
                console.error('加载对话失败:', error);
                Utils.showMessage('加载对话失败: ' + error.message, 'error');

                this.currentConversationId = null;
                sessionStorage.removeItem('last_conversation_id');

                // 使用新方法
                this.showEmptyState();
            }
        }

        // 加载消息 - 添加错误处理
        loadMessages(messages) {
            const container = document.getElementById('conversationContent');
            if (!container) {
                console.error('找不到对话内容容器');
                return;
            }

            // 清空容器，但保留原始HTML作为备份
            const originalHTML = container.innerHTML;
            container.innerHTML = '';

            if (!messages || messages.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = `
                    <div class="empty-icon"><i class="fas fa-comments"></i></div>
                    <div class="empty-title">对话开始</div>
                    <div class="empty-text">这是您的新对话，请输入您的问题开始交流</div>
                `;
                container.appendChild(emptyDiv);
                return;
            }

            let hasError = false;
            let errorCount = 0;

            // 创建文档片段以提高性能
            const fragment = document.createDocumentFragment();

            messages.forEach((msg, index) => {
                try {
                    if (!msg || typeof msg !== 'object') {
                        console.error(`第 ${index} 条消息格式无效:`, msg);
                        errorCount++;
                        return;
                    }

                    const messageElement = this.createMessageElement(msg);

                    // 检查是否成功创建了元素
                    if (messageElement && messageElement.nodeType === Node.ELEMENT_NODE) {
                        fragment.appendChild(messageElement);
                    } else {
                        console.error(`第 ${index} 条消息创建元素失败:`, messageElement);
                        errorCount++;

                        // 创建错误占位符
                        const errorElement = this.createErrorMessage(`消息 ${index + 1} 显示异常`);
                        fragment.appendChild(errorElement);
                    }
                } catch (error) {
                    console.error(`处理第 ${index} 条消息时出错:`, error, msg);
                    errorCount++;

                    // 创建错误占位符
                    const errorElement = this.createErrorMessage(`消息 ${index + 1} 加载失败`);
                    fragment.appendChild(errorElement);
                }
            });

            // 将文档片段添加到容器
            try {
                container.appendChild(fragment);

                // 如果有错误，显示提示
                if (errorCount > 0) {
                    console.warn(`加载消息时发现 ${errorCount} 个错误`);

                    // 可选：显示一个错误提示
                    if (errorCount === messages.length) {
                        // 所有消息都加载失败，恢复原始状态
                        container.innerHTML = originalHTML;
                        Utils.showMessage('加载消息失败，请重试', 'error');
                    } else if (errorCount > 0) {
                        // 部分消息加载失败
                        const errorMsg = document.createElement('div');
                        errorMsg.className = 'message-error-notice';
                        errorMsg.innerHTML = `
                            <div style="background: #fef2f2; border: 1px solid #fee2e2; border-radius: 6px; padding: 10px; margin: 10px 0; font-size: 14px; color: #7f1d1d;">
                                <i class="fas fa-exclamation-triangle"></i>
                                部分消息显示异常（${errorCount}/${messages.length}）
                            </div>
                        `;
                        container.insertBefore(errorMsg, container.firstChild);
                    }
                }

                // 滚动到消息底部
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 100);

            } catch (error) {
                console.error('添加消息到容器时出错:', error);
                // 恢复原始HTML
                container.innerHTML = originalHTML;
                Utils.showMessage('加载对话失败，请重试', 'error');
            }
        }

        // 新增方法：创建文档链接
        createDocumentLinks(container, docIdsStr) {
            try {
                const docRefs = docIdsStr.split(',').filter(ref => ref && ref.trim());
                if (docRefs.length === 0) return;

                // 创建文档容器
                const documentsContainer = document.createElement('div');
                documentsContainer.className = 'message-documents';

                let documentsHTML = `
                    <div class="documents-title">
                        <i class="fas fa-book-open"></i> 相关参考文档
                    </div>
                    <div class="documents-list">
                `;

                // 先创建带ID的链接，然后异步加载标题
                docRefs.forEach(ref => {
                    const docId = ref.trim();
                    documentsHTML += `
                        <a href="document-detail.html?id=${docId}"
                           target="_blank"
                           class="document-item loading"
                           data-doc-id="${docId}"
                           title="正在加载文档信息...">
                            <div class="document-item-title">
                                <i class="fas fa-external-link-alt"></i>
                                <span class="doc-title">文档 ${docId}</span>
                            </div>
                        </a>
                    `;
                });

                documentsHTML += '</div>';
                documentsContainer.innerHTML = documentsHTML;

                // 将文档容器插入到消息内容中
                const messageContent = container.querySelector('.message-content');
                if (messageContent) {
                    messageContent.insertBefore(documentsContainer, messageContent.querySelector('.message-time'));
                }

                // 异步加载文档标题
                this.loadDocumentTitlesAsync(documentsContainer, docRefs);

            } catch (error) {
                console.error('创建文档链接失败:', error);
            }
        }

        // 修改 loadDocumentTitlesAsync 方法
        async loadDocumentTitlesAsync(container, docRefs) {
            try {
                console.log('开始加载文档标题，文档ID列表:', docRefs);

                // 获取所有文档链接元素
                const docLinks = container.querySelectorAll('.document-item');
                console.log('找到的文档链接数量:', docLinks.length);

                // 为每个文档链接独立加载标题
                const promises = Array.from(docLinks).map(async (link) => {
                    const docId = link.getAttribute('data-doc-id');
                    if (!docId) return;

                    try {
                        console.log(`正在获取文档 ${docId} 的标题...`);
                        const response = await documentAPI.getDocumentById(parseInt(docId));
                        console.log(`文档 ${docId} 的响应:`, response);

                        let title = `文档 ${docId}`; // 默认标题

                        // 处理API响应
                        if (response) {
                            if (response.code !== undefined && response.code === 1) {
                                // 完整的Result对象
                                if (response.data && response.data.title) {
                                    title = response.data.title;
                                }
                            } else if (response.title) {
                                // 直接是文档对象
                                title = response.title;
                            } else if (response.data && response.data.title) {
                                // 其他可能的结构
                                title = response.data.title;
                            }
                        }

                        // 更新DOM
                        const titleSpan = link.querySelector('.doc-title');
                        if (titleSpan) {
                            titleSpan.textContent = title;
                            // 更新链接的tooltip
                            link.setAttribute('title', title);
                            // 移除加载状态
                            link.classList.remove('loading');
                            console.log(`文档 ${docId} 标题更新为: ${title}`);
                        }

                    } catch (error) {
                        console.error(`获取文档${docId}标题失败:`, error);
                        // 即使失败，也移除加载状态
                        link.classList.remove('loading');
                    }
                });

                // 使用 Promise.allSettled 而不是 Promise.all，这样即使有失败的请求也不会影响其他
                await Promise.allSettled(promises);
                console.log('所有文档标题加载完成');

            } catch (error) {
                console.error('加载文档标题过程中发生错误:', error);
            }
        }

        // 创建错误消息元素
        createErrorMessage(errorText) {
            const container = document.createElement('div');
            container.className = 'message-container error';
            container.innerHTML = `
                <div class="message-sender error">系统</div>
                <div class="message-content error">
                    <div class="message-text" style="color: #ef4444;">
                        <i class="fas fa-exclamation-circle"></i> ${errorText}
                    </div>
                    <div class="message-time">${Utils.formatDate(new Date(), 'HH:mm')}</div>
                </div>
            `;
            return container;
        }

        // 格式化消息内容
        formatMessageContent(content, isAI = false) {
            if (!content) return '';

            // 如果是AI消息，使用Markdown渲染
            if (isAI) {
                content = ensureTableSpacing(content)
                return MarkdownParser.render(content);
            }

            // 用户消息：简单换行处理
            return content.replace(/\n/g, '<br>');
        }

        // 显示欢迎空状态（无对话选择时）
        showEmptyState() {
            const contentElement = document.getElementById('conversationContent');
            if (!contentElement) return;

            contentElement.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-robot"></i></div>
                    <div class="empty-title">AI维修助手</div>
                    <div class="empty-text">
                        您好！我是您的维修辅助AI助手。<br>
                        我可以帮您解决设备故障、提供维修建议、查找相关文档。
                    </div>
                    <div class="empty-text" style="margin-top: 15px; color: #4a9eff; font-weight: 500;">
                        <i class="fas fa-lightbulb"></i> 请从左侧选择一个历史对话，或点击"新建对话"开始交流
                    </div>
                </div>
            `;

            // 确保输入区域隐藏
            const inputSection = document.getElementById('inputSection');
            if (inputSection) inputSection.style.display = 'none';
        }

        // 新建对话
        async createNewConversation() {
            try {
                Utils.showMessage('正在创建新对话...', 'info');

                const response = await conversationAPI.createConversation();
                console.log('创建对话响应:', response);

                let newConversation = null;

                if (response) {
                    if (response.code !== undefined) {
                        if (response.code !== 1) {
                            throw new Error(response.msg || '创建对话失败');
                        }
                        newConversation = response.data;
                    } else if (response.id !== undefined) {
                        newConversation = response;
                    }
                }

                if (!newConversation) {
                    throw new Error('创建对话失败');
                }

                await this.loadConversation(newConversation.id);
                await this.loadHistoryList(1);

                // 清空输入框和附件
                this.clearInputAndAttachments();

                Utils.showMessage('新对话已创建', 'success');

            } catch (error) {
                console.error('创建对话失败:', error);
                Utils.showMessage('创建对话失败: ' + error.message, 'error');
            }
        }

        // 清空输入框和附件
        clearInputAndAttachments() {
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.value = '';
            }
            this.currentAttachments = [];
            this.uploadedImages = [];
            const previewContainer = document.getElementById('attachmentPreviewContainer');
            if (previewContainer) {
                previewContainer.innerHTML = '';
            }
        }

        // 修改对话标题
        async editConversationTitle(conversationId, currentTitle) {
            const newTitle = prompt('请输入新的对话标题:', currentTitle);
            if (!newTitle || newTitle.trim() === '' || newTitle === currentTitle) {
                return;
            }

            try {
                Utils.showMessage('正在更新标题...', 'info');
                const response = await conversationAPI.updateTitle(conversationId, newTitle.trim());

                console.log('更新标题响应:', response);

                if (response) {
                    if (response.code !== undefined && response.code !== 1) {
                        throw new Error(response.msg || '更新标题失败');
                    }
                }

                // 如果当前正在查看这个对话，更新标题显示
                if (this.currentConversationId === conversationId) {
                    const titleElement = document.getElementById('currentConversationTitle');
                    if (titleElement) {
                        titleElement.textContent = newTitle.trim();
                    }
                }

                // 重新加载历史列表
                await this.loadHistoryList(this.currentPage);
                Utils.showMessage('标题已更新', 'success');

            } catch (error) {
                console.error('更新标题失败:', error);
                Utils.showMessage('更新标题失败: ' + error.message, 'error');
            }
        }

        // 删除对话
        async deleteConversation(conversationId) {
            if (!confirm('确定要删除这个对话吗？此操作不可恢复。')) {
                return;
            }

            try {
                Utils.showMessage('正在删除对话...', 'info');
                const response = await conversationAPI.deleteConversation(conversationId);
                console.log('删除对话响应:', response);

                if (response) {
                    if (response.code !== undefined && response.code !== 1) {
                        throw new Error(response.msg || '删除对话失败');
                    }
                }

                // 如果删除的是当前对话，清空当前视图
                if (this.currentConversationId === conversationId) {
                    this.currentConversationId = null;
                    sessionStorage.removeItem('last_conversation_id');

                    const titleElement = document.getElementById('currentConversationTitle');
                    const dateElement = document.getElementById('currentConversationDate');

                    if (titleElement) titleElement.textContent = '请选择或新建一个对话';
                    if (dateElement) dateElement.textContent = '';

                    // 调用新方法显示空状态并隐藏输入区
                    this.showEmptyState();
                }

                // 重新加载历史列表（重置到第一页，避免页码越界）
                await this.loadHistoryList(1);
                Utils.showMessage('对话已删除', 'success');

            } catch (error) {
                console.error('删除对话失败:', error);
                Utils.showMessage('删除对话失败: ' + error.message, 'error');
            }
        }

        // 发送消息
        async sendMessage() {
            const input = document.getElementById('messageInput');
            const messageText = input ? input.value.trim() : '';

            if (!messageText && this.currentAttachments.length === 0) {
                Utils.showMessage('请输入消息或上传图片', 'warning');
                return;
            }

            if (!this.currentConversationId) {
                Utils.showMessage('请先选择或创建一个对话', 'warning');
                return;
            }

            try {
                Utils.showMessage('正在发送消息...', 'info');

                // 1. 如果有附件，先上传图片
                let uploadedImageUrls = [];
                let tempImageUrls = [];
                if (this.currentAttachments.length > 0) {
                    // 为临时消息创建base64预览
                    const promises = this.currentAttachments.map(file => {
                        return new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                resolve(e.target.result);
                            };
                            reader.readAsDataURL(file);
                        });
                    });

                    tempImageUrls = await Promise.all(promises);

                    const response = await messageAPI.uploadImages(this.currentAttachments);
                    console.log('上传图片响应:', response);

                    if (response) {
                        if (response.code !== undefined && response.code === 1 && response.data) {
                            uploadedImageUrls = response.data.map(img => img.url);
                        } else if (Array.isArray(response)) {
                            uploadedImageUrls = response.map(img => img.url);
                        }
                    }
                }

                // 2. 准备消息数据
                const messageData = {
                    session_id: this.currentConversationId,
                    content_text: messageText,
                    user_uploaded_images: uploadedImageUrls.join(', ')
                };

                // 3. 显示用户消息（临时）
                this.addTemporaryUserMessage(messageText, tempImageUrls);

                // 4. 显示AI思考中
                this.showAIThinking();

                // 5. 发送消息到后端并获取AI回复
                const response = await messageAPI.ask(messageData);
                console.log('发送消息响应:', response);

                // 6. 移除思考中提示和临时消息
                this.removeTemporaryElements();

                // 7. 处理AI回复
                if (response) {
                    // 重新加载消息（获取最新的完整对话）
                    await this.loadConversation(this.currentConversationId);
                }

                // 8. 清空输入和附件
                this.clearInputAndAttachments();

                // 9. 重新加载历史列表以更新时间
                await this.loadHistoryList(this.currentPage);

            } catch (error) {
                console.error('发送消息失败:', error);
                this.removeTemporaryElements();
                Utils.showMessage('发送消息失败: ' + error.message, 'error');
            }
        }

        // 添加临时用户消息
        addTemporaryUserMessage(text, imageUrls) {
            const container = document.getElementById('conversationContent');
            if (!container) return;

            const tempMessage = {
                id: 'temp',
                role: 1, // 用户
                content_text: text,
                user_uploaded_images: imageUrls.join(', '),
                created_time: new Date()
            };

            const messageElement = this.createMessageElement(tempMessage);
            messageElement.id = 'tempUserMessage';
            container.appendChild(messageElement);

            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        // 显示AI思考中
        showAIThinking() {
            const container = document.getElementById('conversationContent');
            if (!container) return;

            const thinkingContainer = document.createElement('div');
            thinkingContainer.className = 'ai-thinking-container';
            thinkingContainer.id = 'aiThinking';
            thinkingContainer.innerHTML = `
                <div class="ai-thinking-sender">AI助手</div>
                <div class="ai-thinking-content">
                    <div class="thinking-icon"><i class="fas fa-robot"></i></div>
                    <div class="thinking-text">正在思考...</div>
                    <div class="thinking-dots">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>
            `;

            container.appendChild(thinkingContainer);
            container.scrollTop = container.scrollHeight;
        }

        // 移除临时元素
        removeTemporaryElements() {
            const tempMessage = document.getElementById('tempUserMessage');
            const thinkingElement = document.getElementById('aiThinking');

            if (tempMessage) tempMessage.remove();
            if (thinkingElement) thinkingElement.remove();
        }

        // 设置事件监听器
        setupEventListeners() {
            // 新建对话按钮
            const newConversationBtn = document.getElementById('newConversationBtn');
            if (newConversationBtn) {
                newConversationBtn.addEventListener('click', () => {
                    this.createNewConversation();
                });
            }

            // 发送按钮
            const sendButton = document.getElementById('sendButton');
            if (sendButton) {
                sendButton.addEventListener('click', () => {
                    this.sendMessage();
                });
            }

            // 消息输入框回车发送（Ctrl+Enter换行）
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
            }

            // 搜索历史对话
            const historySearch = document.getElementById('historySearch');
            if (historySearch) {
                historySearch.addEventListener('input', Utils.debounce(() => {
                    this.loadHistoryList(1);
                }, 500));
            }

            // 附件上传
            this.setupAttachmentUpload();
        }

        // 设置附件上传
        setupAttachmentUpload() {
            const attachmentButton = document.getElementById('attachmentButton');
            const fileInput = document.getElementById('fileInput');
            const previewContainer = document.getElementById('attachmentPreviewContainer');

            // 点击附件按钮
            if (attachmentButton && fileInput) {
                attachmentButton.addEventListener('click', () => {
                    fileInput.click();
                });
            }

            // 文件选择变化
            if (fileInput) {
                fileInput.addEventListener('change', () => {
                    this.handleFileUpload(fileInput.files, previewContainer);
                });
            }
        }

        // 处理文件上传
        handleFileUpload(files, previewContainer) {
            if (!previewContainer) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                // 只接受图片文件
                if (!file.type.startsWith('image/')) {
                    Utils.showMessage('只能上传图片文件', 'warning');
                    continue;
                }

                // 检查文件大小（限制为10MB）
                if (file.size > 10 * 1024 * 1024) {
                    Utils.showMessage('图片大小不能超过10MB', 'warning');
                    continue;
                }

                // 添加到待上传列表
                this.currentAttachments.push(file);

                // 创建附件预览
                this.createAttachmentPreview(file, previewContainer);
            }

            // 清空文件输入，以便可以再次选择相同的文件
            const fileInput = document.getElementById('fileInput');
            if (fileInput) {
                fileInput.value = '';
            }
        }

        // 创建附件预览
        createAttachmentPreview(file, previewContainer) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.createElement('div');
                preview.className = 'attachment-preview';
                preview.setAttribute('data-index', this.currentAttachments.length - 1);

                preview.innerHTML = `
                    <div class="attachment-preview-content">
                        <img src="${e.target.result}" alt="预览">
                        <div class="attachment-info">
                            <div class="attachment-name" title="${file.name}">${file.name}</div>
                            <div class="attachment-size">${this.formatFileSize(file.size)}</div>
                        </div>
                        <button type="button" class="btn-remove-attachment" data-index="${this.currentAttachments.length - 1}">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;

                // 移除附件按钮
                preview.querySelector('.btn-remove-attachment').addEventListener('click', (event) => {
                    event.stopPropagation();
                    const index = parseInt(event.currentTarget.getAttribute('data-index'));
                    this.currentAttachments.splice(index, 1);
                    preview.remove();

                    // 更新所有移除按钮的索引
                    previewContainer.querySelectorAll('.attachment-preview').forEach((item, idx) => {
                        item.setAttribute('data-index', idx);
                        item.querySelector('.btn-remove-attachment').setAttribute('data-index', idx);
                    });
                });

                previewContainer.appendChild(preview);
            };
            reader.readAsDataURL(file);
        }

        // 格式化文件大小
        formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    }

    // 页面加载完成后初始化AI对话系统
    document.addEventListener('DOMContentLoaded', function() {
        // 等待DOM完全加载
        setTimeout(() => {
            if (typeof conversationAPI !== 'undefined' && typeof messageAPI !== 'undefined') {
                window.AIConversation = new AIConversationSystem();
            } else {
                console.error('API未加载完成，请刷新页面');
                Utils.showMessage('系统初始化失败，请刷新页面', 'error');
            }
        }, 500);
    });
</script>
