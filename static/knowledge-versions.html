<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>知识文档版本管理</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/knowledge-versions.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><script src="js/app-config.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/api.js"></script></head><body>
<header class="vm-header"><div class="vm-header-inner"><a class="icon-button" id="backLink" title="返回文档"><i class="fas fa-arrow-left"></i></a><div class="vm-title-block"><div class="eyebrow">知识库 / 版本管理</div><h1 id="pageTitle">文档版本</h1><div class="header-meta" id="headerMeta">正在加载...</div></div><div class="header-actions"><a class="btn btn-secondary" id="versionLabLink"><i class="fas fa-code-branch"></i> 分支视图</a><button class="btn btn-primary" id="newVersionButton"><i class="fas fa-plus"></i> 新建版本</button></div></div></header>
<main class="vm-shell"><nav class="vm-tabs"><button class="tab-button active" data-tab="overview"><i class="fas fa-gauge-high"></i> 概览</button><button class="tab-button" data-tab="versions"><i class="fas fa-code-branch"></i> 版本</button><button class="tab-button" data-tab="audit"><i class="fas fa-clock-rotate-left"></i> 审计记录</button></nav><div id="notice" class="notice" hidden></div>
<section class="tab-panel active" id="tab-overview"><div class="metric-grid" id="metrics"></div><div class="content-grid"><section class="surface"><div class="section-heading"><div><h2>文档设置</h2><p>维护文档编号、类型和所属分类。</p></div><button class="btn btn-primary" id="saveMetadataButton"><i class="fas fa-floppy-disk"></i> 保存</button></div><form id="metadataForm" class="form-grid"><label><span>文档编号</span><input id="documentCode" maxlength="128" required></label><label><span>文档类型</span><select id="documentType"></select></label><label class="full category-field"><span>分类目录</span><input type="hidden" id="categoryId"><button type="button" class="category-trigger" id="categoryTrigger"><span id="categoryPath"><span class="category-placeholder">请选择分类目录</span></span><i class="fas fa-chevron-down"></i></button><div class="category-picker" id="categoryPicker" hidden><div class="category-toolbar"><div class="category-search"><i class="fas fa-magnifying-glass"></i><input id="categorySearch" placeholder="搜索分类"></div><button type="button" class="btn btn-secondary btn-small" id="addRootCategory"><i class="fas fa-plus"></i> 根分类</button></div><div class="category-tree" id="categoryTree"></div></div></label></form></section><section class="surface"><div class="section-heading"><div><h2>当前发布分支</h2><p>所有仍在使用的并存版本；默认展示版本会单独标记。</p></div></div><div id="currentVersionCard" class="empty-state"></div></section></div></section>
<section class="tab-panel" id="tab-versions"><section class="surface"><div class="section-heading"><div><h2>版本历史</h2><p>发布版本不可原地修改，修改从草稿开始。</p></div><div class="filter-row"><select id="statusFilter"><option value="">全部状态</option><option value="draft">草稿</option><option value="pending">待审核</option><option value="approved">已审核</option><option value="published">已发布</option><option value="superseded">已替代</option><option value="invalidated">已作废</option></select><button class="icon-button" id="refreshButton" title="刷新"><i class="fas fa-rotate"></i></button></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>版本</th><th>状态</th><th>变更</th><th>适用设备 / 版本关系</th><th>索引</th><th></th></tr></thead><tbody id="versionRows"></tbody></table></div></section></section>
<section class="tab-panel" id="tab-audit"><section class="surface"><div class="section-heading"><div><h2>审计记录</h2><p>版本创建、编辑、审核、发布和作废均保留记录。</p></div></div><div id="auditTimeline" class="timeline"></div></section></section></main>
<aside class="drawer" id="versionDrawer"><div class="drawer-header"><div><div class="eyebrow">版本详情</div><h2 id="drawerTitle">版本</h2></div><button class="icon-button" data-close-drawer title="关闭"><i class="fas fa-xmark"></i></button></div><div class="drawer-body" id="drawerBody"></div><div class="drawer-footer" id="drawerFooter"></div></aside><div class="drawer-backdrop" id="drawerBackdrop"></div>
<dialog id="createDialog" class="vm-dialog"><form method="dialog" id="createForm"><div class="dialog-header"><div><div class="eyebrow">新版本</div><h2>创建草稿</h2></div><button class="icon-button" value="cancel"><i class="fas fa-xmark"></i></button></div><div class="dialog-content form-grid"><label><span>基础版本</span><select id="baseVersion"></select></label><label><span>变更级别</span><select id="changeCategory"><option value="minor">次版本</option><option value="major">主版本</option><option value="correction">纠错</option><option value="emergency">紧急</option></select></label><label><span>发布目标</span><select id="createPublishMode"><option value="replace">更新已有硬件分支</option><option value="coexist">创建并存硬件分支</option></select></label><label><span>设备硬件版本号</span><input id="createHardwareVersion" maxlength="128" required placeholder="例如：Rev.B、R2"></label><div class="full" id="createPublishTargets"></div><label class="full"><span>变更摘要</span><textarea id="changeSummary" rows="3" required></textarea></label><label class="full"><span>变更原因</span><textarea id="changeReason" rows="2"></textarea></label><label class="full"><span>版本文件</span><div class="file-drop create-file-drop"><i class="fas fa-cloud-arrow-up"></i><strong> 选择修改后的主文件</strong><p class="muted">可同时选择附件；第一个文件作为主文件，其余作为附件。</p><input type="file" id="createVersionFiles" multiple></div><div id="createFileNames" class="selected-files"></div></label></div><div class="dialog-actions"><button class="btn btn-secondary" value="cancel">取消</button><button class="btn btn-primary" id="confirmCreateButton" value="default">创建并上传</button></div></form></dialog>
<dialog id="actionDialog" class="vm-dialog"><form method="dialog" id="actionForm"><div class="dialog-header"><div><div class="eyebrow" id="actionEyebrow">版本操作</div><h2 id="actionTitle">确认操作</h2></div><button class="icon-button" value="cancel"><i class="fas fa-xmark"></i></button></div><div class="dialog-content"><p id="actionDescription" class="action-description"></p><div id="actionExtra"></div><label id="actionCommentField"><span id="actionInputLabel">处理意见</span><textarea id="actionComment" rows="3"></textarea></label><div id="publishFields" class="form-grid publish-fields" hidden><div class="full publish-scope-card" id="publishScopePreview"></div><div class="full publish-block" id="publishTargets"></div></div></div><div class="dialog-actions"><button class="btn btn-secondary" value="cancel">取消</button><button class="btn btn-primary" id="confirmActionButton" value="default">确认发布</button></div></form></dialog>
<dialog id="categoryDialog" class="vm-dialog small"><form method="dialog" id="categoryForm"><div class="dialog-header"><h2>新增分类</h2><button class="icon-button" value="cancel"><i class="fas fa-xmark"></i></button></div><div class="dialog-content"><input type="hidden" id="categoryParentId"><label><span>上级分类</span><input id="categoryParentPath" readonly></label><label><span>分类名称</span><input id="categoryName" maxlength="128" required placeholder="请输入分类名称"></label></div><div class="dialog-actions"><button class="btn btn-secondary" value="cancel">取消</button><button class="btn btn-primary" value="default">创建并选中</button></div></form></dialog>
<script src="js/knowledge-versions.js"></script></body></html>
