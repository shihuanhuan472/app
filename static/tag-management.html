<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-app-template="标签管理 - {{fullName}}"></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/app-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <style>
        .tag-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 20px;
            align-items: start;
        }

        .tag-panel {
            background: #fff;
            border: 1px solid #e8eef7;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04);
        }

        .tag-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tag-toolbar .search-box {
            max-width: 420px;
        }

        .tag-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .tag-table th,
        .tag-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #edf2f7;
            text-align: left;
            vertical-align: middle;
            font-size: 14px;
        }

        .tag-table th {
            color: #5f6f85;
            font-weight: 600;
            background: #f8fafc;
        }

        .tag-name-cell {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tag-name-text,
        .tag-description-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tag-description-text {
            color: #667085;
        }

        .alias-list { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
        .alias-chip {
            display: inline-flex; min-width: 0; max-width: 100%; padding: 3px 7px;
            border: 1px solid #d9e3f0; border-radius: 4px; background: #f8fafc;
            color: #40546d; font-size: 12px; line-height: 18px;
        }
        .alias-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .alias-editor-row { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 8px; }
        .alias-editor-row .icon-btn { width: 38px; height: 38px; }
        .alias-editor-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .alias-editor-item {
            display: grid; grid-template-columns: minmax(0, 1fr) 30px; align-items: center;
            gap: 8px; min-height: 34px; padding: 2px 3px 2px 10px;
            border: 1px solid #e3eaf3; border-radius: 6px; background: #f8fafc;
            color: #40546d; font-size: 13px;
        }
        .alias-editor-item span { overflow-wrap: anywhere; }
        .alias-remove-btn {
            width: 28px; height: 28px; border: 0; background: transparent;
            color: #8492a6; cursor: pointer;
        }
        .alias-remove-btn:hover { color: #ef4444; }
        .alias-editor-empty { padding: 8px 0 2px; color: #98a2b3; font-size: 12px; }

        .tag-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid #d9e3f0;
            background: #fff;
            color: #4a5568;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            color: #4a9eff;
            border-color: #4a9eff;
            background: #f5f9ff;
        }

        .icon-btn:disabled {
            color: #a0aec0;
            border-color: #e2e8f0;
            background: #f8fafc;
            cursor: not-allowed;
        }

        .icon-btn.danger:hover {
            color: #ef4444;
            border-color: #ef4444;
            background: #fff5f5;
        }

        .icon-btn.danger:disabled:hover {
            color: #a0aec0;
            border-color: #e2e8f0;
            background: #f8fafc;
        }

        .tag-form-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            color: #1a3a5f;
            font-weight: 600;
            font-size: 18px;
        }

        .tag-empty {
            padding: 52px 20px;
            text-align: center;
            color: #667085;
        }

        .tag-pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            color: #667085;
            font-size: 13px;
        }

        @media (max-width: 960px) {
            .tag-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="system-container">
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🔧</div>
                    <span data-app-text="shortName"></span>
                </div>
            </div>

            <div class="nav-menu">
                <a href="main.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
                    <span>知识库</span>
                </a>
                <a href="source-documents.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-folder-open"></i></span>
                    <span>源文档库</span>
                </a>
                <a href="my-submissions.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-clipboard-list"></i></span>
                    <span>我的提交</span>
                </a>
                <a href="document-review.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-check-circle"></i></span>
                    <span>文档审核</span>
                </a>
                <a href="ai-assist.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-robot"></i></span>
                    <span>AI辅助</span>
                </a>
                <a href="user-management.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span>用户管理</span>
                </a>
                <a href="tag-management.html" class="nav-item active">
                    <span class="nav-icon"><i class="fas fa-tags"></i></span>
                    <span>标签管理</span>
                </a>
                <a href="user-profile.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-user"></i></span>
                    <span>我的资料</span>
                </a>
            </div>

            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div>
                        <div class="user-name" id="userName">用户</div>
                        <div class="user-role" id="userRole">用户</div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="Utils.logout()" style="margin-top: 10px; width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <div class="page-title">标签管理</div>
                    <div class="page-subtitle">文档标签与检索分类</div>
                </div>
            </div>

            <div class="tag-layout">
                <section class="tag-panel">
                    <div class="tag-toolbar">
                        <div class="search-box">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" class="search-input" id="tagSearchInput" placeholder="搜索标签名称或备注">
                        </div>
                        <button class="btn btn-secondary" type="button" onclick="resetTagSearch()">
                            <i class="fas fa-rotate-left"></i> 重置
                        </button>
                    </div>

                    <div id="tagTableWrap"></div>

                    <div class="tag-pagination" id="tagPagination">
                        <button class="btn btn-secondary btn-sm" id="prevPageBtn" onclick="changeTagPage(tagCurrentPage - 1)">
                            <i class="fas fa-chevron-left"></i> 上一页
                        </button>
                        <span id="tagPageInfo">第 1 页，共 1 页</span>
                        <button class="btn btn-secondary btn-sm" id="nextPageBtn" onclick="changeTagPage(tagCurrentPage + 1)">
                            下一页 <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </section>

                <aside class="tag-panel">
                    <div class="tag-form-title">
                        <span id="tagFormTitle">新增标签</span>
                        <button class="icon-btn" type="button" title="清空" onclick="resetTagForm()">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>

                    <form id="tagForm" onsubmit="submitTagForm(event)">
                        <input type="hidden" id="tagId">
                        <div class="form-group">
                            <label class="form-label required" for="tagName">标签名称</label>
                            <input type="text" id="tagName" class="form-control" maxlength="50" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="tagAliasInput">识别别名</label>
                            <div class="alias-editor-row">
                                <input type="text" id="tagAliasInput" class="form-control" maxlength="100" placeholder="输入一个别名">
                                <button class="icon-btn" type="button" title="添加别名" aria-label="添加别名" onclick="addTagAlias()">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <div id="tagAliasList" class="alias-editor-list"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="tagDescription">备注</label>
                            <textarea id="tagDescription" class="form-control form-textarea" rows="4" maxlength="200"></textarea>
                        </div>
                        <button class="btn btn-primary" type="submit" id="tagSubmitBtn" style="width: 100%;">
                            <i class="fas fa-save"></i> 保存
                        </button>
                    </form>
                </aside>
            </div>
        </div>
    </div>

    <script>
        let tagCurrentPage = 1;
        let tagPageSize = 10;
        let tagTotalPages = 1;
        let tagKeyword = '';
        let tagSubmitting = false;
        let tagRows = [];
        let tagAliases = [];

        document.addEventListener('DOMContentLoaded', () => {
            const user = Utils.checkLogin();
            Utils.loadUserInfo();
            if (!canManageTags(user)) {
                Utils.showMessage('当前身份没有权限访问标签管理', 'error');
                setTimeout(() => window.location.href = 'main.html', 900);
                return;
            }

            const searchInput = document.getElementById('tagSearchInput');
            searchInput.addEventListener('input', Utils.debounce(() => {
                tagKeyword = searchInput.value.trim();
                tagCurrentPage = 1;
                loadTags();
            }, 300));

            document.getElementById('tagAliasInput').addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    addTagAlias();
                }
            });

            renderTagAliasEditor();
            loadTags();
        });

        function canManageTags(user) {
            return Utils.hasRole(user, Utils.ROLE.ADMIN) || Utils.hasRole(user, Utils.ROLE.TECHNICIAN);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function loadTags() {
            const wrap = document.getElementById('tagTableWrap');
            wrap.innerHTML = '<div class="tag-empty"><i class="fas fa-spinner fa-spin"></i> 正在加载</div>';
            try {
                const data = await tagAPI.getTagsPage(tagCurrentPage, tagPageSize, tagKeyword);
                const tags = data.tags || [];
                tagTotalPages = Math.max(Number(data.total_pages || 1), 1);
                renderTags(tags);
                renderTagPagination(Number(data.total_count || 0));
            } catch (error) {
                wrap.innerHTML = `<div class="tag-empty">${escapeHtml(error.message || '加载失败')}</div>`;
            }
        }

        function renderTags(tags) {
            const wrap = document.getElementById('tagTableWrap');
            tagRows = Array.isArray(tags) ? tags : [];
            if (!tags.length) {
                wrap.innerHTML = '<div class="tag-empty">暂无标签</div>';
                return;
            }

            const rows = tags.map(tag => {
                const documentCount = Number(tag.document_count || 0);
                const pendingReviewCount = Number(tag.pending_review_count || 0);
                const deleteDisabled = documentCount > 0 || pendingReviewCount > 0 ? 'disabled' : '';
                const deleteTitle = documentCount > 0
                    ? `已有 ${documentCount} 篇文档使用该标签，不能删除`
                    : pendingReviewCount > 0
                        ? `已有 ${pendingReviewCount} 条待审核记录使用该标签，不能删除`
                    : '删除';
                const aliases = Array.isArray(tag.match_aliases) ? tag.match_aliases : [];
                const aliasesHtml = aliases.length
                    ? aliases.map(alias => `<span class="alias-chip" title="${escapeHtml(alias)}"><span class="alias-chip-text">${escapeHtml(alias)}</span></span>`).join('')
                    : '<span class="tag-description-text">-</span>';
                return `
                <tr>
                    <td>
                        <div class="tag-name-cell">
                            <span class="tag-name-text" title="${escapeHtml(tag.name)}">${escapeHtml(tag.name)}</span>
                        </div>
                    </td>
                    <td><div class="alias-list">${aliasesHtml}</div></td>
                    <td><span class="tag-description-text" title="${escapeHtml(tag.description || '')}">${escapeHtml(tag.description || '-')}</span></td>
                    <td>${documentCount}</td>
                    <td>${formatDate(tag.updated_time || tag.created_time)}</td>
                    <td>
                        <div class="tag-actions">
                            <button class="icon-btn" title="编辑" onclick="editTagById(${Number(tag.id)})">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="icon-btn danger" title="${escapeHtml(deleteTitle)}" onclick="deleteTag(${Number(tag.id)})" ${deleteDisabled}>
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
            }).join('');

            wrap.innerHTML = `
                <table class="tag-table">
                    <thead>
                        <tr>
                            <th style="width: 18%;">名称</th>
                            <th style="width: 24%;">识别别名</th>
                            <th>备注</th>
                            <th style="width: 90px;">文档</th>
                            <th style="width: 130px;">更新时间</th>
                            <th style="width: 96px; text-align: right;">操作</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function renderTagPagination(totalCount) {
            document.getElementById('tagPageInfo').textContent = `第 ${tagCurrentPage} 页，共 ${tagTotalPages} 页，共 ${totalCount} 条`;
            document.getElementById('prevPageBtn').disabled = tagCurrentPage <= 1;
            document.getElementById('nextPageBtn').disabled = tagCurrentPage >= tagTotalPages;
        }

        function formatDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleDateString('zh-CN');
        }

        function resetTagSearch() {
            document.getElementById('tagSearchInput').value = '';
            tagKeyword = '';
            tagCurrentPage = 1;
            loadTags();
        }

        function changeTagPage(page) {
            if (page < 1 || page > tagTotalPages) return;
            tagCurrentPage = page;
            loadTags();
        }

        function editTag(tag) {
            document.getElementById('tagFormTitle').textContent = '编辑标签';
            document.getElementById('tagId').value = tag.id || '';
            document.getElementById('tagName').value = tag.name || '';
            tagAliases = Array.isArray(tag.match_aliases) ? [...tag.match_aliases] : [];
            document.getElementById('tagAliasInput').value = '';
            renderTagAliasEditor();
            document.getElementById('tagDescription').value = tag.description || '';
        }

        function editTagById(tagId) {
            const tag = tagRows.find(item => Number(item.id) === Number(tagId));
            if (!tag) {
                Utils.showMessage('标签不存在', 'error');
                return;
            }
            editTag(tag);
        }

        function resetTagForm() {
            document.getElementById('tagFormTitle').textContent = '新增标签';
            document.getElementById('tagId').value = '';
            document.getElementById('tagName').value = '';
            tagAliases = [];
            document.getElementById('tagAliasInput').value = '';
            renderTagAliasEditor();
            document.getElementById('tagDescription').value = '';
        }

        function renderTagAliasEditor() {
            const list = document.getElementById('tagAliasList');
            if (!tagAliases.length) {
                list.innerHTML = '<div class="alias-editor-empty">暂未添加识别别名</div>';
                return;
            }
            list.innerHTML = tagAliases.map((alias, index) => `
                <div class="alias-editor-item">
                    <span>${escapeHtml(alias)}</span>
                    <button class="alias-remove-btn" type="button" title="删除别名" aria-label="删除别名" onclick="removeTagAlias(${index})">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        function addTagAlias() {
            const input = document.getElementById('tagAliasInput');
            const alias = input.value.trim();
            if (!alias) return;
            if (/[，,\r\n]/.test(alias)) {
                Utils.showMessage('每次只能添加一个别名，请勿输入逗号或换行', 'warning');
                return;
            }
            if (tagAliases.some(item => item.toLocaleLowerCase() === alias.toLocaleLowerCase())) {
                Utils.showMessage('该识别别名已存在', 'warning');
                return;
            }
            tagAliases.push(alias);
            input.value = '';
            renderTagAliasEditor();
            input.focus();
        }

        function removeTagAlias(index) {
            tagAliases.splice(index, 1);
            renderTagAliasEditor();
        }

        async function submitTagForm(event) {
            event.preventDefault();
            if (tagSubmitting) return;

            const id = document.getElementById('tagId').value;
            const name = document.getElementById('tagName').value.trim();
            const pendingAlias = document.getElementById('tagAliasInput').value.trim();
            if (pendingAlias) {
                Utils.showMessage('还有未添加的识别别名，请先点击加号添加', 'warning');
                return;
            }
            const match_aliases = [...tagAliases];
            const description = document.getElementById('tagDescription').value.trim();
            if (!name) {
                Utils.showMessage('标签名称不能为空', 'error');
                return;
            }

            tagSubmitting = true;
            const btn = document.getElementById('tagSubmitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 保存中';

            try {
                if (id) {
                    await tagAPI.updateTag({ id: Number(id), name, description, match_aliases });
                    Utils.showMessage('标签已更新', 'success');
                } else {
                    await tagAPI.addTag({ name, description, match_aliases });
                    Utils.showMessage('标签已新增', 'success');
                }
                resetTagForm();
                await loadTags();
            } catch (error) {
                Utils.showMessage(error.message || '保存失败', 'error');
            } finally {
                tagSubmitting = false;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> 保存';
            }
        }

        async function deleteTag(tagId) {
            const tag = tagRows.find(item => Number(item.id) === Number(tagId));
            const documentCount = Number(tag && tag.document_count || 0);
            const pendingReviewCount = Number(tag && tag.pending_review_count || 0);
            if (documentCount > 0 || pendingReviewCount > 0) {
                const message = documentCount > 0
                    ? `已有 ${documentCount} 篇文档使用该标签，不能删除`
                    : `已有 ${pendingReviewCount} 条待审核记录使用该标签，不能删除`;
                Utils.showMessage(message, 'warning');
                return;
            }
            if (!confirm('确认删除该标签？')) return;
            try {
                await tagAPI.deleteTag(tagId);
                Utils.showMessage('标签已删除', 'success');
                await loadTags();
            } catch (error) {
                Utils.showMessage(error.message || '删除失败', 'error');
            }
        }
    </script>
</body>
</html>
