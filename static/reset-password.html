<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-app-template="重置密码 - {{fullName}}">重置密码</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .reset-panel { max-width: 480px; }
        .reset-header { text-align: center; margin-bottom: 26px; }
        .reset-header h1 { color: #1a3a5f; font-size: 28px; margin: 0 0 10px; }
        .reset-header h1 i { margin-right: 8px; }
        .reset-header p { color: #64748b; font-size: 14px; line-height: 1.7; }
        .reset-panel .form-group { margin-bottom: 18px; }
        .code-row { display: flex; align-items: stretch; gap: 10px; }
        .code-row .form-control { flex: 1; min-width: 0; width: 0; }
        .code-button { flex-shrink: 0; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f0f7ff; color: #1971c2; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
        .code-button:hover:not(:disabled) { background: #e2efff; border-color: #1971c2; }
        .reset-panel button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .reset-panel button:focus-visible, .back-link:focus-visible { outline: 2px solid #4a9eff; outline-offset: 3px; }
        .field-note { color: #64748b; font-size: 12px; margin-top: 6px; }
        #message { overflow-wrap: anywhere; margin-top: 16px; padding: 10px 12px; border: 1px solid #dbe3ec; border-radius: 6px; background: #f0f7ff; color: #1a3a5f; font-size: 14px; line-height: 1.6; }
        #message:empty { display: none; }
        #message.is-error { border-color: #fca5a5; border-left: 4px solid #dc2626; background: #fef2f2; color: #b91c1c; }
        .reset-links { text-align: center; margin-top: 18px; }
        .back-link { color: #1971c2; font-size: 14px; font-weight: 600; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        @media (max-width: 500px) {
            .reset-shell { padding: 20px 16px; }
            .reset-panel { padding: 26px 20px; }
            .reset-header h1 { font-size: 26px; }
            .reset-panel .form-control { font-size: 16px; }
            .code-button { padding: 0 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <main class="login-container reset-shell">
      <section class="login-card reset-panel" aria-labelledby="resetTitle">
        <div class="reset-header">
            <h1 id="resetTitle"><i class="fas fa-key" aria-hidden="true"></i>重置密码</h1>
            <p data-app-text="fullName"></p>
            <p>通过绑定手机号的钉钉验证码找回账号密码</p>
        </div>
        <form id="resetForm">
            <div class="form-group">
                <label class="form-label" for="username">登录账号（用户名）</label>
                <input class="form-control" id="username" placeholder="请输入登录账号" autocomplete="username" maxlength="50" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">绑定手机号</label>
                <input class="form-control" id="phone" type="tel" placeholder="请输入账号绑定的手机号" autocomplete="tel" inputmode="numeric" pattern="1[3-9][0-9]{9}" maxlength="11" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="code">钉钉验证码</label>
                <div class="code-row">
                    <input class="form-control" id="code" placeholder="6位验证码" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="codeNote" required>
                    <button class="code-button" id="sendCode" type="button">发送钉钉验证码</button>
                </div>
                <p class="field-note" id="codeNote">请在钉钉中查收，验证码5分钟内有效</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="newPassword">新密码</label>
                <input class="form-control" id="newPassword" type="password" placeholder="请输入新密码（至少6位）" autocomplete="new-password" minlength="6" maxlength="128" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">确认新密码</label>
                <input class="form-control" id="confirmPassword" type="password" placeholder="请再次输入新密码" autocomplete="new-password" minlength="6" maxlength="128" required>
            </div>
            <button class="login-btn" id="submitReset" type="submit"><i class="fas fa-check" aria-hidden="true"></i> 重置密码</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <div class="reset-links"><a class="back-link" id="backToLogin" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回登录</a></div>
        <div class="login-footer"><p data-app-template="© {{copyrightYear}} {{fullName}} {{version}}"></p></div>
      </section>
    </main>
    <script src="js/app-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/reset-password.js?v=20261013-login-redirect"></script>
</body>
</html>
