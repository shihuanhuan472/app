<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档审核 - 维修辅助系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/api.js"></script>
    <script src="js/review.js"></script>
    <style>
        .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #374151;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }
        .tab-btn.active { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }

        .status-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 20px;
            font-weight: 600;
        }
        .status-0 { color: #92400e; background: #fef3c7; }
        .status-1 { color: #065f46; background: #d1fae5; }
        .status-2 { color: #991b1b; background: #fee2e2; }
        .status-3 { color: #374151; background: #e5e7eb; }

        .type-pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 20px;
            font-weight: 600;
            color: #1d4ed8;
            background: #dbeafe;
        }

        .review-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .review-modal-content {
            width: min(980px, 95vw);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            padding: 20px;
        }
        .review-section { margin-bottom: 16px; }
        .review-section h4 {
            margin-bottom: 8px;
            color: #1f2937;
            font-size: 15px;
        }
        .review-text {
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #60a5fa;
            padding: 10px 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #374151;
            line-height: 1.65;
        }
        .review-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 12px;
        }
        .review-textarea {
            width: 100%;
            min-height: 90px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            resize: vertical;
            font-family: inherit;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="review-modal" id="reviewModal">
        <div class="review-modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 style="margin:0;color:#111827;">审核详情</h3>
                <button class="btn btn-secondary btn-sm" id="closeReviewModalBtn" onclick="closeReviewModal()">关闭</button>
            </div>
            <div id="reviewModalBody"></div>
        </div>
    </div>

    <div class="system-container">
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🔧</div>
                    <span>维修辅助系统</span>
                </div>
            </div>

            <div class="nav-menu">
                <a href="main.html" class="nav-item"><span class="nav-icon"><i class="fas fa-file-alt"></i></span><span>知识库</span></a>
                <a href="my-submissions.html" class="nav-item"><span class="nav-icon"><i class="fas fa-clipboard-list"></i></span><span>我的提交</span></a>
                <a href="document-review.html" class="nav-item active"><span class="nav-icon"><i class="fas fa-check-circle"></i></span><span>文档审核</span></a>
                <a href="ai-assist.html" class="nav-item"><span class="nav-icon"><i class="fas fa-robot"></i></span><span>AI辅助</span></a>
                <a href="user-management.html" class="nav-item"><span class="nav-icon"><i class="fas fa-users"></i></span><span>用户管理</span></a>
                <a href="user-profile.html" class="nav-item"><span class="nav-icon"><i class="fas fa-user"></i></span><span>我的资料</span></a>
            </div>

            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">我</div>
                    <div>
                        <div class="user-name" id="userName">当前用户</div>
                        <div class="user-role" id="userRole">审核人员</div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="Utils.logout()" style="margin-top: 10px; width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div>
                    <div class="page-title">文档审核</div>
                    <div class="page-subtitle">审核新增、修改与删除申请</div>
                </div>
            </div>

            <div class="document-container">
                <div class="tabs">
                    <button class="tab-btn active" id="pendingTabBtn" onclick="switchTab('pending')">待审核</button>
                    <button class="tab-btn" id="allTabBtn" onclick="switchTab('all')">全部记录</button>
                </div>
                <div class="document-grid" id="reviewList"></div>
            </div>
        </div>
    </div>

    <script>
        const statusMap = {0: '待审核', 1: '已通过', 2: '已驳回', 3: '已撤回'};
        const actionMap = {1: '新增', 2: '修改', 3: '删除'};
        let currentTab = 'pending';
        let currentReviews = [];
        let rawReviews = [];
        let reviewSubmitting = false;

        function escapeHtml(text) {
            const value = text == null ? '' : String(text);
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function canReview(user) {
            if (!user) return false;
            return Utils.hasRole(user, Utils.ROLE.ADMIN, Utils.ROLE.REVIEWER);
        }

        function setTabButtonState() {
            const pendingBtn = document.getElementById('pendingTabBtn');
            const allBtn = document.getElementById('allTabBtn');
            if (pendingBtn) pendingBtn.classList.toggle('active', currentTab === 'pending');
            if (allBtn) allBtn.classList.toggle('active', currentTab === 'all');
        }

        async function switchTab(tab) {
            currentTab = tab;
            setTabButtonState();
            await loadReviewList();
        }

        async function loadReviewList() {
            const list = document.getElementById('reviewList');
            list.innerHTML = `
                <div class="document-loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载审核列表...</p>
                </div>
            `;

            try {
                const data = currentTab === 'pending'
                    ? await reviewAPI.getReviewPendingList()
                    : await reviewAPI.getReviewAllList();

                rawReviews = Array.isArray(data) ? data : [];
                currentReviews = currentTab === 'pending'
                    ? buildPendingDisplayList(rawReviews)
                    : rawReviews;

                renderReviewList();
            } catch (error) {
                list.innerHTML = `
                    <div class="document-error">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ef4444; margin-bottom: 20px;"></i>
                        <p style="color: #666; margin-bottom: 20px;">加载审核列表失败：${escapeHtml(error.message || '未知错误')}</p>
                    </div>
                `;
            }
        }

        function buildPendingDisplayList(items) {
            const latestByKey = new Map();
            const mergedCountByKey = new Map();

            items.forEach(item => {
                const key = getPendingGroupKey(item);
                if (!latestByKey.has(key)) {
                    latestByKey.set(key, item);
                    mergedCountByKey.set(key, 0);
                    return;
                }
                mergedCountByKey.set(key, (mergedCountByKey.get(key) || 0) + 1);
            });

            const displayItems = [];
            latestByKey.forEach((item, key) => {
                displayItems.push({
                    ...item,
                    _merged_count: mergedCountByKey.get(key) || 0
                });
            });

            return displayItems;
        }

        function getPendingGroupKey(item) {
            const actionType = Number(item.action_type);
            const documentId = Number(item.document_id);
            const contributorId = Number(item.contributor_id);
            if ((actionType === 2 || actionType === 3) && Number.isFinite(documentId) && documentId > 0) {
                return `doc-${documentId}-action-${actionType}-user-${Number.isFinite(contributorId) ? contributorId : 'na'}`;
            }
            return `review-${item.id}`;
        }

        function renderReviewList() {
            const list = document.getElementById('reviewList');
            if (!currentReviews.length) {
                list.innerHTML = `
                    <div class="document-empty">
                        <i class="fas fa-check-circle" style="font-size: 56px; color: #e8e8e8; margin-bottom: 20px;"></i>
                        <p style="color: #666;">暂无审核记录</p>
                    </div>
                `;
                return;
            }

            let html = '';
            currentReviews.forEach(item => {
                const statusText = statusMap[item.status] || `状态${item.status}`;
                const actionText = actionMap[item.action_type] || `类型${item.action_type}`;
                const dateText = item.first_edit_date ? String(item.first_edit_date).slice(0, 10) : '未知日期';
                const content = item.problem_intro ? escapeHtml(item.problem_intro.slice(0, 100)) : '无内容';
                const comment = escapeHtml(item.review_comment || '无');
                const mergedHint = item._merged_count > 0
                    ? `<div style="font-size:12px; color:#6b7280; margin-bottom:8px;">已合并重复待审 ${item._merged_count} 条（仅展示最新）</div>`
                    : '';

                html += `
                    <div class="document-item" onclick="openReviewModal(${item.id})">
                        <div class="document-item-header">
                            <div class="document-item-title">${escapeHtml(item.title || '未命名提交')}</div>
                        </div>
                        <div class="document-item-content">${content}</div>
                        <div style="display:flex; gap:8px; margin-bottom:10px;">
                            <span class="type-pill">${actionText}</span>
                            <span class="status-pill status-${item.status}">${statusText}</span>
                        </div>
                        <div style="font-size:13px; color:#666; margin-bottom:8px;">审核意见：${comment}</div>
                        ${mergedHint}
                        <div class="document-item-footer">
                            <div class="document-item-author">
                                <i class="fas fa-user"></i>
                                <span>${escapeHtml(item.contributor_name || '未知')}</span>
                            </div>
                            <div class="document-item-date">${dateText}</div>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function getReviewById(reviewId) {
            return currentReviews.find(item => Number(item.id) === Number(reviewId)) || null;
        }

        function renderSection(title, value) {
            return `
                <div class="review-section">
                    <h4>${title}</h4>
                    <div class="review-text">${escapeHtml(value || '无')}</div>
                </div>
            `;
        }

        function openReviewModal(reviewId) {
            const item = getReviewById(reviewId);
            if (!item) return;

            const statusText = statusMap[item.status] || `状态${item.status}`;
            const actionText = actionMap[item.action_type] || `类型${item.action_type}`;
            const createdAt = item.first_edit_date ? Utils.formatDate(item.first_edit_date, 'YYYY-MM-DD HH:mm') : '未知';
            const reviewedAt = item.reviewed_time ? Utils.formatDate(item.reviewed_time, 'YYYY-MM-DD HH:mm') : '未审核';
            const canOperate = Number(item.status) === 0;

            const docLink = item.document_id
                ? `<a href="document-detail.html?id=${item.document_id}&source=knowledge" target="_blank" class="btn btn-secondary btn-sm"><i class="fas fa-link"></i> 查看当前文档</a>`
                : '';

            const operateHtml = canOperate ? `
                <div class="review-section">
                    <h4>审核意见</h4>
                    <textarea class="review-textarea" id="reviewCommentInput" placeholder="可填写审核意见（可选）"></textarea>
                    <div class="review-actions">
                        <button class="btn btn-danger" id="rejectBtn" onclick="rejectReview(${item.id})"><i class="fas fa-times"></i> 驳回</button>
                        <button class="btn btn-primary" id="approveBtn" onclick="approveReview(${item.id})"><i class="fas fa-check"></i> 通过</button>
                    </div>
                </div>
            ` : '';

            document.getElementById('reviewModalBody').innerHTML = `
                <div class="review-section">
                    <h4>${escapeHtml(item.title || '未命名提交')}</h4>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <span class="type-pill">${actionText}</span>
                        <span class="status-pill status-${item.status}">${statusText}</span>
                        <span class="status-pill status-3">提交人：${escapeHtml(item.contributor_name || '未知')}</span>
                        <span class="status-pill status-3">提交时间：${createdAt}</span>
                        <span class="status-pill status-3">审核时间：${reviewedAt}</span>
                    </div>
                </div>
                ${renderSection('审核意见（当前）', item.review_comment || '无')}
                ${renderSection('问题描述', item.problem_intro)}
                ${renderSection('原因分析', item.causes)}
                ${renderSection('故障评估', item.evaluation)}
                ${renderSection('检查步骤', item.inspection)}
                ${renderSection('解决方案', item.solutions)}
                ${renderSection('关键要点', item.key_points)}
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
                    <div>${docLink}</div>
                </div>
                ${operateHtml}
            `;

            document.getElementById('reviewModal').style.display = 'flex';
        }

        function closeReviewModal(force = false) {
            if (reviewSubmitting && !force) return;
            document.getElementById('reviewModal').style.display = 'none';
        }

        function getCommentInputValue() {
            const input = document.getElementById('reviewCommentInput');
            return input ? input.value.trim() : '';
        }

        function setReviewSubmitting(submitting, actionType = 'approve') {
            reviewSubmitting = submitting;
            const approveBtn = document.getElementById('approveBtn');
            const rejectBtn = document.getElementById('rejectBtn');
            const commentInput = document.getElementById('reviewCommentInput');
            const closeBtn = document.getElementById('closeReviewModalBtn');

            if (approveBtn) {
                approveBtn.disabled = submitting;
                approveBtn.innerHTML = submitting && actionType === 'approve'
                    ? '<i class="fas fa-spinner fa-spin"></i> 处理中...'
                    : '<i class="fas fa-check"></i> 通过';
            }
            if (rejectBtn) {
                rejectBtn.disabled = submitting;
                rejectBtn.innerHTML = submitting && actionType === 'reject'
                    ? '<i class="fas fa-spinner fa-spin"></i> 处理中...'
                    : '<i class="fas fa-times"></i> 驳回';
            }
            if (commentInput) commentInput.disabled = submitting;
            if (closeBtn) closeBtn.disabled = submitting;
        }

        async function approveReview(reviewId) {
            if (reviewSubmitting) return;
            setReviewSubmitting(true, 'approve');
            try {
                const comment = getCommentInputValue();
                await reviewAPI.approveReview(reviewId, comment || null);
                Utils.showMessage('审核通过成功', 'success');
                closeReviewModal(true);
                await loadReviewList();
            } catch (error) {
                Utils.showMessage('审核通过失败：' + (error.message || '未知错误'), 'error');
            } finally {
                setReviewSubmitting(false, 'approve');
            }
        }

        async function rejectReview(reviewId) {
            if (reviewSubmitting) return;
            setReviewSubmitting(true, 'reject');
            try {
                const comment = getCommentInputValue();
                await reviewAPI.rejectReview(reviewId, comment || null);
                Utils.showMessage('驳回成功', 'success');
                closeReviewModal(true);
                await loadReviewList();
            } catch (error) {
                Utils.showMessage('驳回失败：' + (error.message || '未知错误'), 'error');
            } finally {
                setReviewSubmitting(false, 'reject');
            }
        }

        document.addEventListener('DOMContentLoaded', async function() {
            Utils.checkLogin();
            Utils.loadUserInfo();
            const currentUser = Utils.getCurrentUser();
            if (!canReview(currentUser)) {
                Utils.showMessage('当前账号没有文档审核权限', 'warning');
                setTimeout(() => window.location.replace('main.html'), 400);
                return;
            }
            await loadReviewList();
        });

        document.getElementById('reviewModal').addEventListener('click', function(e) {
            if (e.target === this) closeReviewModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeReviewModal();
        });
    </script>
</body>
</html>
