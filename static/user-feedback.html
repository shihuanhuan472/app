<main class="main-content"><div class="header"><div><div class="page-title">问题反馈</div><div class="page-subtitle">提交对系统的建议、问题与需求</div></div></div><section class="feedback-layout"><form id="feedbackForm" class="feedback-form"><h2>填写反馈</h2><div class="field-grid"><label>软件名称<select id="software" required><option value="">请选择</option><option>智能诊断知识库</option><option>智能诊断系统</option><option>实验室管理云平台</option></select></label><label>类型<select id="feedbackType" required><option value="">请选择</option><option>问题</option><option>需求</option></select></label><label class="full">问题/需求描述<input id="description" maxlength="200" placeholder="请输入内容" required></label><label class="full">详细描述<textarea id="details" maxlength="2000" placeholder="可以补充出现场景、复现步骤、期望的效果等"></textarea><span class="counter"><b id="detailCount">0</b> / 2000</span></label><label>部门<select id="department" required><option value="">请选择</option><option>研发</option><option>生产/工程/质量</option><option>FSE/FAS</option></select></label><label>人员<input id="person" maxlength="100" placeholder="请输入姓名" required></label></div><label class="full attachment-label">图片和附件<span class="hint">最多 6 个，单个不超过 10 MB</span><input id="files" type="file" multiple accept="image/*,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.log"><span id="fileNames" class="file-names">未选择文件</span></label><button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane"></i> 提交反馈</button><p id="formMessage" role="status"></p></form><section class="feedback-history"><h2>我的反馈</h2><div id="feedbackList"><p class="empty">加载中...</p></div></section></section></main></div><script src="js/user-feedback-page.js?v=20261021-redesign-1"></script></body></html>
