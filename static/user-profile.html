<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资料 - 设备维修辅助系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
    <style>
        /* 个人资料页面样式 */
        .profile-container {
            padding: 20px 0;
        }

        .profile-view, .profile-edit {
            transition: all 0.3s ease;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #f0f0f0;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .profile-info h3 {
            font-size: 28px;
            color: #1a3a5f;
            margin-bottom: 8px;
        }

        .profile-role {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            padding: 6px 16px;
            background: #e7f5ff;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
        }

        .profile-actions {
            display: flex;
            gap: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .info-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            transition: all 0.3s ease;
        }

        .info-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .info-label i {
            color: #4a9eff;
            font-size: 16px;
        }

        .info-value {
            font-size: 18px;
            color: #1a3a5f;
            font-weight: 600;
            word-break: break-word;
        }

        /* 编辑表单样式 */
        .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .edit-header h3 {
            margin: 0;
            font-size: 22px;
            color: #1a3a5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-form {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-section h4 {
            font-size: 18px;
            color: #1a3a5f;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        /* 安全设置区域 */
        .password-section {
            padding: 20px 0;
        }

        /* 修改密码按钮颜色 - 改为蓝色 */
        .change-password-btn {
            background-color: #10b981 !important;
            color: white !important;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .change-password-btn:hover {
            background-color: #0da271 !important;
            transform: translateY(-1px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .profile-actions {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 修改密码模态框样式优化 - 简化版 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .modal-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            width: 420px;
            max-width: 90%;
            max-height: 90vh;
            overflow: hidden;
            z-index: 1001;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header .modal-close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .modal-header .modal-close-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .modal-body {
            padding: 20px;
            background: white;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #f0f0f0;
            background: white;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 表单样式优化 - 解决两个眼睛图标问题 */
        .modal-body .form-group {
            margin-bottom: 16px;
        }

        .modal-body .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .password-input-wrapper {
            position: relative;
        }

        /* 隐藏浏览器自带的密码显示图标 */
        .modal-body .form-group input[type="password"]::-ms-reveal,
        .modal-body .form-group input[type="password"]::-ms-clear {
            display: none;
        }

        /* 在WebKit浏览器中隐藏密码显示图标 */
        .modal-body .form-group input[type="password"]::-webkit-credentials-auto-fill-button,
        .modal-body .form-group input[type="password"]::-webkit-contacts-auto-fill-button,
        .modal-body .form-group input[type="password"]::-webkit-strong-password-auto-fill-button {
            visibility: hidden;
            display: none !important;
            pointer-events: none;
            height: 0;
            width: 0;
            margin: 0;
        }

        .modal-body .form-group input {
            width: 100%;
            padding: 12px 40px 12px 16px; /* 增加右侧padding给图标留空间 */
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            box-sizing: border-box;
            /* 移除默认的外观 */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .modal-body .form-group input:focus {
            border-color: #4a9eff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.1);
        }

        /* 自定义密码显示/隐藏按钮 */
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
            z-index: 2; /* 确保按钮在输入框上方 */
        }

        .password-toggle-btn:hover {
            background: #f0f0f0;
            color: #666;
        }

        .password-toggle-btn i {
            pointer-events: none; /* 防止图标干扰按钮点击 */
        }

        .password-hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            display: block;
        }

        /* 密码强度指示器 - 简化版 */
        .password-strength {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            height: 24px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-level {
            height: 100%;
            width: 0%;
            background: #ef4444;
            border-radius: 2px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-text {
            font-size: 12px;
            color: #666;
            min-width: 40px;
            text-align: right;
            transition: color 0.3s ease;
        }

        /* 按钮样式 */
        .modal-footer .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 90px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-footer .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        .modal-footer .btn-secondary:hover {
            background: #e2e8f0;
        }

        .modal-footer .btn-primary {
            background: #10b981;
            color: white;
            border: none;
        }

        .modal-footer .btn-primary:hover {
            background: #0da271;
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .modal-dialog {
                width: 95%;
                border-radius: 8px;
            }

            .modal-header {
                padding: 16px;
            }

            .modal-body {
                padding: 16px;
            }

            .modal-footer {
                padding: 12px 16px;
                flex-direction: column;
            }

            .modal-footer .btn {
                width: 100%;
                min-width: auto;
            }
        }

        /* 输入框样式 */
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #4a9eff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="system-container">
        <!-- 侧边导航栏 -->
        <div class="sidebar">
            <div class="logo-container">
                <div class="logo">
                    <div class="logo-icon">🔧</div>
                    <span>维修辅助系统</span>
                </div>
            </div>

            <div class="nav-menu">
                <a href="main.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
                    <span>知识库</span>
                </a>
                <a href="my-submissions.html" class="nav-item" id="mySubmissionsNav">
                    <span class="nav-icon"><i class="fas fa-clipboard-list"></i></span>
                    <span>我的提交</span>
                </a>
                <a href="ai-assist.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-robot"></i></span>
                    <span>AI辅助</span>
                </a>
                <!-- 管理员显示这个 -->
                <a href="user-management.html" class="nav-item">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span>用户管理</span>
                </a>
                <!-- 技术人员显示这个 -->
                <a href="user-profile.html" class="nav-item" style="display: none;">
                    <span class="nav-icon"><i class="fas fa-user"></i></span>
                    <span>我的资料</span>
                </a>
            </div>

            <div class="user-info">
                <div class="user-details">
                    <div class="user-avatar" id="userAvatar">李</div>
                    <div>
                        <div class="user-name" id="userName">李四</div>
                        <div class="user-role" id="userRole">维修工程师</div>
                    </div>
                </div>
                <button class="btn btn-secondary btn-sm" onclick="Utils.logout()" style="margin-top: 10px; width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="header">
                <div>
                    <div class="page-title">我的资料</div>
                    <div class="page-subtitle">查看和编辑个人信息</div>
                </div>
            </div>

            <!-- 个人资料卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">基本信息</div>
                </div>

                <div class="profile-container">
                    <!-- 个人信息展示 -->
                    <div class="profile-view" id="profileView">
                        <!-- 内容由JavaScript动态生成 -->
                    </div>

                    <!-- 编辑表单 -->
                    <div class="profile-edit" id="profileEdit" style="display: none;">
                        <div class="edit-header">
                            <h3><i class="fas fa-user-edit"></i> 编辑个人信息</h3>
                            <button class="btn btn-icon btn-sm" onclick="switchToViewMode()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <form id="profileForm" class="profile-form">
                            <div class="form-section">
                                <h4><i class="fas fa-info-circle"></i> 基本信息</h4>
                                <div class="form-group">
                                    <label><i class="fas fa-font"></i> 姓名</label>
                                    <input type="text" id="editFullName" placeholder="请输入姓名" required>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label><i class="fas fa-phone"></i> 电话</label>
                                        <input type="tel" id="editPhone" placeholder="请输入电话" required>
                                    </div>
                                    <div class="form-group">
                                        <label><i class="fas fa-envelope"></i> 邮箱</label>
                                        <input type="email" id="editEmail" placeholder="请输入邮箱">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label><i class="fas fa-building"></i> 部门</label>
                                    <input type="text" id="editDepartment" placeholder="请输入部门">
                                </div>
                            </div>

                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="switchToViewMode()">
                                    取消
                                </button>
                                <button type="button" class="btn btn-primary" onclick="saveProfile()">

                    </div>

            <!-- 安全设置卡片 -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">安全设置</div>
                </div>

                <div class="password-section">
                    <button class="change-password-btn" onclick="showChangePasswordModal()">
                        <i class="fas fa-key"></i> 修改密码
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 修改密码模态框 - 修复两个眼睛图标问题 -->
    <div class="modal-overlay" id="changePasswordModal"></div>
    <div class="modal-dialog" id="changePasswordDialog">
        <div class="modal-header">
            <h3><i class="fas fa-lock"></i> 修改密码</h3>
            <button class="modal-close-btn" onclick="closeChangePasswordModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>当前密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="currentPassword" placeholder="请输入当前密码" autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('currentPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('newPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <span class="password-hint">密码长度至少6位</span>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-level" id="passwordStrengthBar"></div>
                        </div>
                        <div class="strength-text" id="passwordStrengthText">弱</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="请再次输入新密码" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirmPassword')">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeChangePasswordModal()">
                <i class="fas fa-times"></i> 取消
            </button>
            <button class="btn btn-primary" onclick="changePassword()">
                <i class="fas fa-check"></i> 确认修改
            </button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let passwordStrengthCheckDebounce = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('用户资料页面加载完成');
            initPage();
        });

        // 初始化页面
        async function initPage() {
            try {
                // 检查登录状态
                const token = sessionStorage.getItem('token');
                if (!token) {
                    window.location.href = 'index.html';
                    return;
                }

                // 显示加载状态
                showLoading();

                // 加载用户信息
                await loadUserProfile();

            } catch (error) {
                console.error('页面初始化失败:', error);
                showError(`页面初始化失败: ${error.message || '未知错误'}`);
            }
        }

        // 显示加载状态
        function showLoading() {
            const profileView = document.getElementById('profileView');
            if (profileView) {
                profileView.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <div style="width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #4a9eff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                        <p style="color: #666; margin-top: 20px;">正在加载用户信息...</p>
                    </div>
                `;
            }
        }

        // 显示错误
        function showError(message) {
            const profileView = document.getElementById('profileView');
            if (profileView) {
                profileView.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ef4444; margin-bottom: 20px;"></i>
                        <p style="color: #666; margin-bottom: 20px;">${message}</p>
                        <div style="display: flex; gap: 12px; justify-content: center;">
                            <button class="btn" onclick="location.reload()">
                                <i class="fas fa-redo"></i> 重新加载
                            </button>
                            <button class="btn btn-primary" onclick="logout()">
                                <i class="fas fa-sign-out-alt"></i> 重新登录
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // 加载用户资料
        async function loadUserProfile() {
            try {
                console.log('开始加载用户资料...');

                // 从后端获取用户资料
                const response = await userAPI.getUserProfile();

                if (response && response.code === 1 && response.data) {
                    currentUser = response.data;
                    console.log('获取到的用户数据:', currentUser);

                    // 更新页面显示
                    renderProfileView(currentUser);

                    // 更新侧边栏
                    updateSidebar(currentUser);

                    // 更新菜单显示
                    updateMenuByRole(currentUser);

                } else {
                    throw new Error(response.msg || '获取用户信息失败');
                }

            } catch (error) {
                console.error('加载用户资料失败:', error);
                showError('加载用户信息失败: ' + error.message);
            }
        }

        // 渲染资料显示区域
        function renderProfileView(user) {
            const profileView = document.getElementById('profileView');
            if (!profileView) return;

            // 基本信息
            const name = user.full_name || user.username || '未设置';
            const username = user.username || '未设置';
            const department = user.department || '未设置';
            const phone = user.phone || '未设置';
            const email = user.email || '未设置';

            // 角色
            const roleText = Utils.hasRole(user, Utils.ROLE.ADMIN) ? '系统管理员' : '维修工程师';

            // 头像首字母
            const avatarChar = name.charAt(0).toUpperCase();

            // 头像颜色
            const isAdmin = Utils.hasRole(user, Utils.ROLE.ADMIN);
            const avatarBg = isAdmin
                ? 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)'
                : 'linear-gradient(135deg, #4a9eff 0%, #1971c2 100%)';

            // 格式化日期
            const formatDate = (dateString) => {
                if (!dateString) return '未设置';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                } catch (e) {
                    return dateString;
                }
            };

            const createdTime = formatDate(user.created_time);
            const lastLogin = user.last_login ? formatDate(user.last_login) : '从未登录';

            // 生成HTML
            profileView.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-large" style="background: ${avatarBg}">
                        ${avatarChar}
                    </div>
                    <div class="profile-info">
                        <h3>${name}</h3>
                        <div class="profile-role">${roleText}</div>
                        <div class="profile-actions">
                            <button class="btn btn-primary" onclick="switchToEditMode()">
                                <i class="fas fa-edit"></i> 编辑资料
                            </button>
                        </div>
                    </div>
                </div>

                <div class="profile-details">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-user"></i> 用户名
                            </div>
                            <div class="info-value">${username}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-building"></i> 部门
                            </div>
                            <div class="info-value">${department}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-phone"></i> 电话
                            </div>
                            <div class="info-value">${phone}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-envelope"></i> 邮箱
                            </div>
                            <div class="info-value">${email}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-calendar-alt"></i> 注册时间
                            </div>
                            <div class="info-value">${createdTime}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="fas fa-clock"></i> 最后登录
                            </div>
                            <div class="info-value">${lastLogin}</div>
                        </div>
                    </div>
                </div>
            `;

            // 更新编辑表单
            updateEditForm(user);
        }

        // 更新编辑表单
        function updateEditForm(user) {
            if (!user) return;

            const editFullName = document.getElementById('editFullName');
            const editPhone = document.getElementById('editPhone');
            const editEmail = document.getElementById('editEmail');
            const editDepartment = document.getElementById('editDepartment');

            if (editFullName) editFullName.value = user.full_name || '';
            if (editPhone) editPhone.value = user.phone || '';
            if (editEmail) editEmail.value = user.email || '';
            if (editDepartment) editDepartment.value = user.department || '';
        }

        // 更新侧边栏
        function updateSidebar(user) {
            const name = user.full_name || user.username || '用户';
            const roleText = Utils.hasRole(user, Utils.ROLE.ADMIN) ? '系统管理员' : '维修工程师';

            // 侧边栏头像
            const avatarChar = name.charAt(0).toUpperCase();
            const avatarElement = document.getElementById('userAvatar');
            if (avatarElement) {
                avatarElement.textContent = avatarChar;
                avatarElement.style.backgroundColor = Utils.hasRole(user, Utils.ROLE.ADMIN) ? '#dc2626' : '#4a9eff';
            }

            // 侧边栏用户名
            const nameElement = document.getElementById('userName');
            if (nameElement) {
                nameElement.textContent = name;
            }

            // 侧边栏角色
            const roleElement = document.getElementById('userRole');
            if (roleElement) {
                roleElement.textContent = roleText;
            }
        }

        // 更新菜单显示
        function updateMenuByRole(user) {
            const userManagementLink = document.querySelector('a[href="user-management.html"]');
            const myProfileLink = document.querySelector('a[href="user-profile.html"]');
            const aiAssistLink = document.querySelector('a[href="ai-assist.html"]');

            const isAdmin = Utils.hasRole(user, Utils.ROLE.ADMIN);

            if (userManagementLink) {
                userManagementLink.style.display = isAdmin ? 'flex' : 'none';
            }

            if (myProfileLink) {
                myProfileLink.style.display = 'flex';
            }

            if (aiAssistLink) {
                aiAssistLink.style.display = 'flex';
            }
        }

        // 切换到编辑模式
        function switchToEditMode() {
            const profileView = document.getElementById('profileView');
            const profileEdit = document.getElementById('profileEdit');

            if (profileView && profileEdit) {
                profileView.style.display = 'none';
                profileEdit.style.display = 'block';
            }
        }

        // 切换到查看模式
        function switchToViewMode() {
            const profileView = document.getElementById('profileView');
            const profileEdit = document.getElementById('profileEdit');

            if (profileView && profileEdit) {
                profileView.style.display = 'block';
                profileEdit.style.display = 'none';
                loadUserProfile();
            }
        }

        // 保存个人资料
        async function saveProfile() {
            const fullName = document.getElementById('editFullName').value.trim() || '';
            const phone = document.getElementById('editPhone').value.trim() || '';
            const email = document.getElementById('editEmail').value.trim() || '';
            const department = document.getElementById('editDepartment').value.trim() || '';

            if (!fullName) {
                Utils.showMessage('姓名不能为空', 'error');
                return;
            }

            if (!phone) {
                Utils.showMessage('电话不能为空', 'error');
                return;
            }

            if (email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    Utils.showMessage('请输入有效的邮箱地址', 'error');
                    return;
                }
            }

            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                Utils.showMessage('请输入有效的手机号码', 'error');
                return;
            }

            const updateData = {
                full_name: fullName,
                phone: phone,
                email: email || null,
                department: department || null
            };

            try {
                Utils.showMessage('正在保存...', 'info');

                const response = await userAPI.updateUser(updateData);

                if (response && response.code === 1) {
                    Utils.showMessage('个人信息更新成功', 'success');

                    if (response.data) {
                        currentUser = response.data;
                        sessionStorage.setItem('user', JSON.stringify(currentUser));
                    }

                    setTimeout(() => {
                        switchToViewMode();
                    }, 1000);
                } else {
                    throw new Error(response.msg || '更新失败');
                }
            } catch (error) {
                console.error('保存用户信息失败:', error);
                Utils.showMessage(`保存失败: ${error.message}`, 'error');
            }
        }

        // 切换密码显示/隐藏 - 修复版
        function togglePasswordVisibility(fieldId) {
            console.log('切换密码显示/隐藏:', fieldId);
            const input = document.getElementById(fieldId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('i');

            if (!input || !icon) {
                console.error('找不到输入框或图标');
                return;
            }

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                button.setAttribute('title', '隐藏密码');
                console.log('密码已显示');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                button.setAttribute('title', '显示密码');
                console.log('密码已隐藏');
            }
        }

        // 密码强度检测 - 简化版
        function checkPasswordStrength(password) {
            if (password.length < 6) return 1;
            if (password.length < 8) return 2;
            if (password.length >= 8) {
                let strength = 2;
                if (/[A-Z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;
                return Math.min(strength, 4);
            }
            return 1;
        }

        // 密码强度检测 - 防抖处理
        function updatePasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strength = checkPasswordStrength(password);
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');

            if (!strengthBar || !strengthText) return;

            // 设置强度条颜色和宽度
            const colors = ['#ef4444', '#f59e0b', '#84cc16', '#10b981'];
            const texts = ['弱', '一般', '良好', '强'];

            const level = Math.min(strength, 4) - 1;
            strengthBar.style.width = (level + 1) * 25 + '%';
            strengthBar.style.backgroundColor = colors[level] || colors[0];
            strengthText.textContent = texts[level] || texts[0];
            strengthText.style.color = colors[level] || colors[0];
        }

        // 显示修改密码模态框
        function showChangePasswordModal() {
            console.log('显示修改密码模态框');
            const modal = document.getElementById('changePasswordModal');
            const dialog = document.getElementById('changePasswordDialog');

            if (modal && dialog) {
                // 清空表单
                const form = document.getElementById('changePasswordForm');
                if (form) form.reset();

                // 重置密码强度指示器
                const strengthBar = document.getElementById('passwordStrengthBar');
                const strengthText = document.getElementById('passwordStrengthText');
                if (strengthBar) {
                    strengthBar.style.width = '0%';
                    strengthBar.style.backgroundColor = '#ef4444';
                }
                if (strengthText) {
                    strengthText.textContent = '弱';
                    strengthText.style.color = '#ef4444';
                }

                // 绑定新密码输入事件（防抖处理）
                const newPasswordInput = document.getElementById('newPassword');
                if (newPasswordInput) {
                    // 移除之前的事件监听器
                    newPasswordInput.removeEventListener('input', handlePasswordInput);
                    // 添加新的事件监听器
                    newPasswordInput.addEventListener('input', handlePasswordInput);
                }

                // 显示模态框
                modal.style.display = 'block';
                dialog.style.display = 'block';
            } else {
                console.error('找不到模态框元素');
            }
        }

        // 处理密码输入事件（防抖）
        function handlePasswordInput() {
            if (passwordStrengthCheckDebounce) {
                clearTimeout(passwordStrengthCheckDebounce);
            }
            passwordStrengthCheckDebounce = setTimeout(updatePasswordStrength, 150);
        }

        // 关闭修改密码模态框
        function closeChangePasswordModal() {
            const modal = document.getElementById('changePasswordModal');
            const dialog = document.getElementById('changePasswordDialog');

            if (modal && dialog) {
                modal.style.display = 'none';
                dialog.style.display = 'none';

                // 清理防抖定时器
                if (passwordStrengthCheckDebounce) {
                    clearTimeout(passwordStrengthCheckDebounce);
                    passwordStrengthCheckDebounce = null;
                }
            }
        }

        // 修改密码
        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value || '';
            const newPassword = document.getElementById('newPassword').value || '';
            const confirmPassword = document.getElementById('confirmPassword').value || '';

            if (!currentPassword || !newPassword || !confirmPassword) {
                Utils.showMessage('请填写完整的密码信息', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                Utils.showMessage('两次输入的新密码不一致', 'error');
                return;
            }

            if (newPassword.length < 6) {
                Utils.showMessage('密码长度不能少于6位', 'error');
                return;
            }

            try {
                Utils.showMessage('正在修改密码...', 'info');

                const response = await userAPI.changePassword(currentPassword, newPassword);

                if (response && response.code === 1) {
                    Utils.showMessage('密码修改成功', 'success');

                    closeChangePasswordModal();

                    const form = document.getElementById('changePasswordForm');
                    if (form) form.reset();
                } else {
                    throw new Error(response.msg || '修改密码失败');
                }
            } catch (error) {
                console.error('修改密码失败:', error);
                Utils.showMessage(`修改密码失败: ${error.message}`, 'error');
            }
        }

        // 退出登录
        function logout() {
            sessionStorage.removeItem('token');
            sessionStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
