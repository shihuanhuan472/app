      .subtitle { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #647084; }
      .layerText { font: 700 25px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #fff; writing-mode: tb; glyph-orientation-vertical: 0; letter-spacing: 4px; }
      .boxText { font: 17px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .smallText { font: 14px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #374151; }
      .tinyText { font: 12px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5b6778; }
      .panelTitle { font: 700 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #172033; }
      .tagText { font: 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1f2937; }
      .node { fill: #fff; stroke: #4b6381; stroke-width: 1.6; rx: 4; filter: url(#softShadow); }
      .nodeBlue { fill: #eef5ff; stroke: #2f5e9b; stroke-width: 1.6; rx: 4; filter: url(#softShadow); }
      .nodeGreen { fill: #effaf0; stroke: #4d8f4d; stroke-width: 1.6; rx: 4; filter: url(#softShadow); }
      .nodeOrange { fill: #fff4ea; stroke: #b45b1b; stroke-width: 1.6; rx: 4; filter: url(#softShadow); }
      .nodeViolet { fill: #f5efff; stroke: #7650b7; stroke-width: 1.6; rx: 4; filter: url(#softShadow); }
      .line { stroke: #253044; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .lineThin { stroke: #253044; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #79869a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
